name = "mmp-coin-ai-reliability"
main = "reliability-worker.js"
compatibility_date = "2026-11-04"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "mmp_coin_ai_private_admin"
database_id = "dfb3ee95-ef2f-4067-a973-31b8fb1ee62f"

[[services]]
binding = "ANALYZER"
service = "mmp-coin-ai-analyzer"
environment = "production"

[[services]]
binding = "RADAR"
service = "mmp-coin-ai-radar"
environment = "production"

[[services]]
binding = "FUTURES"
service = "mmp-coin-ai-futures"
environment = "production"

[[services]]
binding = "TETHER"
service = "mmp-coin-ai-tether-monitor"
environment = "production"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
