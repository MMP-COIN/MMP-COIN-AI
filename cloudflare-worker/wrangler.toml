name = "mmp-coin-ai-analyzer"
main = "worker.js"
compatibility_date = "2026-11-04"

[ai]
binding = "AI"

[[ratelimits]]
name = "AI_ANALYSIS_LIMITER"
namespace_id = "2026110401"

[ratelimits.simple]
limit = 15
period = 60

[[ratelimits]]
name = "PUBLIC_API_LIMITER"
namespace_id = "2026110402"

[ratelimits.simple]
limit = 300
period = 60

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "mmp_coin_ai_private_admin"
database_id = "dfb3ee95-ef2f-4067-a973-31b8fb1ee62f"

[placement]
region = "aws:eu-central-1"

[[d1_databases]]
binding = "MARKET_CACHE_DB"
database_name = "mmp_market_data_fallback"
database_id = "45b2a51c-49d1-4e21-b13c-86e9d8fffa6e"

[vars]
# Conservative cap; Cloudflare AI calls stop after this many successful reservations per UTC day.
CF_AI_DAILY_MAX_CALLS = "20"
