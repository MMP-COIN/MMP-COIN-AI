name: MMP COIN AI - audit full Quantum market universe

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/worker.js"
      - "cloudflare-worker/radar-worker.js"
      - "cloudflare-worker/quantum-core.js"
      - "www/index.html"
      - ".github/workflows/asset-audit.yml"
  schedule:
    - cron: "25 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmp-asset-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Test every asset on all analysis timeframes
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          node <<'NODE'
          const fs = require('fs');
          const WORKER = process.env.WORKER_URL;
          const intervals = ['15m','1h','4h','1d'];
          const minRows = tf => tf === '1d' ? 20 : 30;
          const html = fs.readFileSync('index.html','utf8');
          const nonTradableIds = new Set(['tether','usd-coin','dai','usds','ethena-usde','first-digital-usd','paypal-usd','true-usd','frax','usdd','wrapped-bitcoin','coinbase-wrapped-btc','lido-staked-ether','wrapped-steth','rocket-pool-eth','staked-ether','staked-ether-2','tether-gold']);
          const nonTradableSymbols = new Set(['USDT','USDC','DAI','USDS','USDE','FDUSD','PYUSD','TUSD','FRAX','USDD','WBTC','CBBTC','STETH','WSTETH','RETH','XAUT','USDY','GT','PEARL','DRV']);

          async function getJson(url, timeout=7000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
              const r = await fetch(url, {headers:{'Accept':'application/json','User-Agent':'MMP-QUANTUM-UNIVERSE-AUDIT/1.0'}, signal:controller.signal, cache:'no-store'});
              const body = await r.text();
              if (!r.ok) throw new Error('HTTP '+r.status+' '+body.slice(0,100));
              let data; try { data = JSON.parse(body); } catch { throw new Error('Invalid JSON '+body.slice(0,80)); }
              return data;
            } finally { clearTimeout(timer); }
          }
          async function firstValid(candidates, tf) {
            const errors=[];
            for (const c of candidates) {
              try {
                const data=await getJson(c.url);
                const rows=c.rows(data);
                if (!Array.isArray(rows) || rows.length < minRows(tf)) throw new Error('کندل ناکافی: '+(Array.isArray(rows)?rows.length:0));
                return {ok:true,provider:c.name,candles:rows.length};
              } catch(e) { errors.push(c.name+': '+String(e.message||e).slice(0,140)); }
            }
            return {ok:false,error:errors.join(' | ')};
          }
          const pairParts = pair => {
            const p=String(pair||'').toUpperCase();
            for (const q of ['USDT','USDC','FDUSD','BUSD','USD','BTC','ETH']) if (p.endsWith(q) && p.length>q.length) return {base:p.slice(0,-q.length),quote:q};
            return null;
          };
          const rowsArray = x => Array.isArray(x);
          const spotCandidates = (pair,tf,support) => {
            const p=pairParts(pair); if(!p) return [];
            const {base,quote}=p, bybitTf={'15m':'15','1h':'60','4h':'240','1d':'D'}[tf], okxTf={'15m':'15m','1h':'1H','4h':'4H','1d':'1Dutc'}[tf], bitgetTf={'15m':'15m','1h':'1H','4h':'4H','1d':'1D'}[tf], kucoinTf={'15m':'15min','1h':'1hour','4h':'4hour','1d':'1day'}[tf];
            const c=[];
            for(const host of ['https://api.binance.com','https://api1.binance.com','https://api2.binance.com','https://api3.binance.com','https://data-api.binance.vision']) c.push({name:'Binance Spot',url:host+'/api/v3/klines?symbol='+pair+'&interval='+tf+'&limit=250',rows:rowsArray});
            c.push({name:'Bitget Spot',url:'https://api.bitget.com/api/v3/market/candles?category=SPOT&symbol='+pair+'&interval='+bitgetTf+'&limit=250',rows:d=>(d?.code==='00000'||d?.code==='0')?d.data:null});
            for(const host of ['https://api.kucoin.com','https://api.kucoin.tr']) c.push({name:'KuCoin Spot',url:host+'/api/v1/market/candles?symbol='+base+'-'+quote+'&type='+kucoinTf,rows:d=>d?.code==='200000'?d.data:null});
            for(const host of ['https://api.gateio.ws','https://api.gate.us']) c.push({name:'Gate.io Spot',url:host+'/api/v4/spot/candlesticks?currency_pair='+base+'_'+quote+'&interval='+tf+'&limit=250',rows:rowsArray});
            for(const host of ['https://whitebit.com','https://whitebit.eu','https://whitebit.tr','https://whitebit.ge']) c.push({name:'WhiteBIT Spot',url:host+'/api/v1/public/kline?market='+base+'_'+quote+'&interval='+tf+'&limit=250',rows:d=>d?.success===true?d.result:null});
            for(const host of ['https://api.bybit.eu','https://api.bytick.eu','https://api.bybit.com','https://api.bytick.com']) c.push({name:'Bybit Spot',url:host+'/v5/market/kline?category=spot&symbol='+pair+'&interval='+bybitTf+'&limit=250',rows:d=>d?.retCode===0?d.result?.list:null});
            for(const host of ['https://www.okx.com','https://us.okx.com','https://openapi.okx.com']) c.push({name:'OKX Spot',url:host+'/api/v5/market/candles?instId='+base+'-'+quote+'&bar='+okxTf+'&limit=250',rows:d=>d?.code==='0'?d.data:null});
            const supported=new Set(Array.isArray(support?.spot?.providers)?support.spot.providers:[]);
            return supported.size?c.filter(x=>supported.has(x.name.replace(/ Spot$/,""))).slice(0,2):c.slice(0,4);
          };
          const futuresCandidates = (pair,tf,support) => {
            const p=pairParts(pair); if(!p) return [];
            const {base,quote}=p, bybitTf={'15m':'15','1h':'60','4h':'240','1d':'D'}[tf], okxTf={'15m':'15m','1h':'1H','4h':'4H','1d':'1Dutc'}[tf];
            const c=[{name:'Binance Futures',url:'https://fapi.binance.com/fapi/v1/klines?symbol='+pair+'&interval='+tf+'&limit=250',rows:rowsArray}];
            for(const host of ['https://api.bybit.eu','https://api.bytick.eu','https://api.bybit.com','https://api.bytick.com']) c.push({name:'Bybit Linear',url:host+'/v5/market/kline?category=linear&symbol='+pair+'&interval='+bybitTf+'&limit=250',rows:d=>d?.retCode===0?d.result?.list:null});
            for(const host of ['https://www.okx.com','https://us.okx.com','https://openapi.okx.com']) c.push({name:'OKX Swap',url:host+'/api/v5/market/candles?instId='+base+'-'+quote+'-SWAP&bar='+okxTf+'&limit=250',rows:d=>d?.code==='0'?d.data:null});
            const supported=new Set(Array.isArray(support?.futures?.providers)?support.futures.providers:[]);
            return supported.size?c.filter(x=>supported.has(x.name.split(" ")[0])).slice(0,2):c;
          };
          async function checkAsset(asset, support) {
            const symbol=String(asset.symbol).toUpperCase();
            const spotPair=support?.spot?.pair || symbol+'USDT';
            const futuresPair=support?.futures?.pair || symbol+'USDT';
            const tests=[];
            for(const tf of intervals) {
              let result=await firstValid(spotCandidates(spotPair,tf,support),tf);
              let market='spot';
              if(!result.ok && support?.futures?.confirmed) {
                const fut=await firstValid(futuresCandidates(futuresPair,tf,support),tf);
                if(fut.ok){result=fut;market='futures';}
                else result.error='Spot: '+result.error+' || Futures: '+fut.error;
              }
              tests.push({timeframe:tf,market,...result});
            }
            return {id:asset.id,name:asset.name,symbol,rank:asset.market_cap_rank||null,tests,ready:tests.every(x=>x.ok)};
          }
          (async()=>{
            const universe=await getJson(WORKER+'/hunter-universe',25000);
            const top=Array.isArray(universe.hunter_assets)?universe.hunter_assets:[];
            const assetSource='MMP Quantum dynamic multi-exchange universe';
            if(!top.length)throw new Error('Quantum universe returned no eligible USDT instruments');
            console.log('Asset list source: '+assetSource+'; discovered '+top.length+' instruments');
            const map=new Map();
            top.forEach(c=>{
              if(!c?.id||!c?.symbol)return;
              const symbol=String(c.symbol).toUpperCase();
              if(nonTradableIds.has(c.id)||nonTradableSymbols.has(symbol)||map.has(symbol))return;
              map.set(symbol,{...c,symbol});
            });
            const candidates=[...map.values()].filter(x=>/^[A-Z0-9_]{2,30}$/.test(String(x.symbol||"").toUpperCase()));
            const supportMap={},supportSources={};
            for(let i=0;i<candidates.length;i+=120){
              const symbols=[...new Set(candidates.slice(i,i+120).map(x=>String(x.symbol).toUpperCase()))];
              const supportPayload=await getJson(WORKER+'/support-check?symbols='+encodeURIComponent(symbols.join(',')),12000);
              (supportPayload.assets||[]).forEach(x=>{supportMap[String(x.symbol||"").toUpperCase()]=x;});
              Object.assign(supportSources,supportPayload.sources||{});
            }
            if(!Object.values(supportSources).some(x=>x?.ok))throw new Error('Exchange catalogs unavailable; cannot verify tradable assets');
            const assets=candidates.filter(x=>{
              const support=supportMap[String(x.symbol||"").toUpperCase()];
              return !!support?.spot?.confirmed;
            });
            if(!assets.length)throw new Error('No instruments have confirmed active Spot USDT markets');
            const results=[];
            const batchSize=24;
            for(let i=0;i<assets.length;i+=batchSize){
              const batch=assets.slice(i,i+batchSize);
              const rows=await Promise.all(batch.map(a=>checkAsset(a,supportMap[String(a.symbol).toUpperCase()])));
              results.push(...rows);
              console.log('Checked '+results.length+'/'+assets.length+' dynamic-universe instruments');
            }
            const failed=results.filter(x=>!x.ready);
            const report={checked_at:new Date().toISOString(),asset_count:results.length,ready_count:results.length-failed.length,failed_count:failed.length,intervals,results,source:assetSource};
            fs.writeFileSync('asset-audit.json',JSON.stringify(report,null,2));
            const md=['# MMP QUANTUM — بررسی کامل یونیورس پویا','', 'منبع: '+assetSource,'زمان بررسی: '+report.checked_at,'', 'نتیجه: '+report.ready_count+'/'+report.asset_count+' آماده تحلیل؛ '+report.failed_count+' مورد نیازمند بررسی','', '| ارز | نماد | 15m | 1h | 4h | 1d | نتیجه |','|---|---|---|---|---|---|---|'];
            for(const x of results)md.push('| '+x.name+' | '+x.symbol+' | '+(x.tests[0].provider||'خطا')+' | '+(x.tests[1].provider||'خطا')+' | '+(x.tests[2].provider||'خطا')+' | '+(x.tests[3].provider||'خطا')+' | '+(x.ready?'آماده':'نیازمند اصلاح')+' |');
            fs.writeFileSync('asset-audit.md',md.join('\\n'));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md.join('\\n')+'\\n');
            console.log(JSON.stringify({checked:results.length,ready:report.ready_count,failed:report.failed_count,failed_assets:failed.map(x=>({symbol:x.symbol,tests:x.tests.filter(t=>!t.ok)}))},null,2));
            if(failed.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload full per-asset audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MMP-COIN-AI-quantum-universe-audit
          path: |
            asset-audit.json
            asset-audit.md
          if-no-files-found: warn
          retention-days: 30
