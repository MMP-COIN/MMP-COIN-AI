name: MMP COIN AI - audit full Quantum market universe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmp-asset-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Validate Worker syntax and live interface integrity
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const { execFileSync } = require('child_process');
          const workers = [
            'cloudflare-worker/worker.js',
            'cloudflare-worker/radar-worker.js',
            'cloudflare-worker/futures-worker.js',
            'cloudflare-worker/quantum-core.js',
            'cloudflare-worker/admin-worker.js'
          ];
          for (const file of workers) {
            execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync(file, 'utf8') });
            console.log('JavaScript syntax OK: ' + file);
          }
          const html = fs.readFileSync('www/index.html', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]);
          const duplicates = [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))];
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + duplicates.join(', '));
          if (/market-ticker|ticker-item|renderMarketTicker/.test(html)) throw new Error('Removed horizontal market ticker code has returned');
          if (html.includes('checkNativeApkUpdate') || !html.includes('function checkNativeUpdate(manual){checkLivePageUpdate(!!manual);}')) throw new Error('Native app update must remain internal-only without an APK version update');
          if (!html.includes("params.set('mmp_live_refresh',String(Date.now()))")) throw new Error('Native live-update cache refresh is missing');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let parsed = 0;
          for (let i = 0; i < scripts.length; i++) {
            const attrs = scripts[i][1], code = scripts[i][2];
            if (/\bsrc\s*=/.test(attrs) || !code.trim()) continue;
            new vm.Script(code, { filename: 'www/index.html:inline-script-' + i });
            parsed++;
          }
          if (parsed < 10) throw new Error('Too few inline scripts were syntax-checked: ' + parsed);
          const lab = fs.readFileSync('www/quantum-lab.html', 'utf8');
          const labScripts = [...lab.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let labParsed = 0;
          for (let i = 0; i < labScripts.length; i++) {
            if (/\bsrc\s*=/.test(labScripts[i][1]) || !labScripts[i][2].trim()) continue;
            new vm.Script(labScripts[i][2], { filename: 'www/quantum-lab.html:inline-script-' + i });
            labParsed++;
          }
          for (const route of ['/hunter-universe','/hunter-scan','/market-candles','/market-orderflow']) {
            if (!lab.includes(route)) throw new Error('Quantum Lab worker route missing: ' + route);
          }
          if (lab.includes('https://api.binance.com')) throw new Error('Quantum Lab direct Binance dependency returned');
          if (!lab.includes('fetch(API+"/hunter-snapshot"') || !lab.includes('function startLiveMonitor()') || !lab.includes('function engineEvidence(i)') || !lab.includes('id="super-engine-capabilities"') || !lab.includes('MMP QUANTUM SUPER ENGINE') || !lab.includes('۱۲ قابلیت تخصصی ابرموتور')) throw new Error('Quantum Lab must expose one persistent super-engine panel with 12 integrated capabilities');
          console.log('Quantum Lab inline scripts parsed: ' + labParsed + '; multi-exchange scan wiring passed.');
          const version = html.match(/name=["']mmp-app-version["'] content=["']([^"']+)["']/i);
          const capacitor = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          if (!version || version[1] !== '2.0.0') throw new Error('App web version metadata changed unexpectedly');
          if (capacitor.appId !== 'com.mmpcoinai.app' || capacitor.server?.url !== 'https://mmp-coin.github.io/?mmp_native_version=1.0.307') {
            throw new Error('Native app identity or live-update URL changed unexpectedly');
          }
          console.log('HTML IDs unique: ' + ids.length + '; inline scripts parsed: ' + parsed);
          console.log('App version, package identity and live-update URL preserved');
          NODE

      - name: Test every asset on all analysis timeframes
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          node <<'NODE'
          const fs = require('fs');
          const WORKER = process.env.WORKER_URL;
          const intervals = ['15m','1h','4h','1d'];
          const fastIntervals = ['1m','3m','5m'];
          const minRows = tf => tf === '1d' ? 20 : 30;
          const html = fs.readFileSync('www/index.html','utf8');
          const nonTradableIds = new Set(['tether','usd-coin','dai','usds','ethena-usde','first-digital-usd','paypal-usd','true-usd','frax','usdd','wrapped-bitcoin','coinbase-wrapped-btc','lido-staked-ether','wrapped-steth','rocket-pool-eth','staked-ether','staked-ether-2','tether-gold']);
          const nonTradableSymbols = new Set(['USDT','USDC','DAI','USDS','USDE','FDUSD','PYUSD','TUSD','FRAX','USDD','WBTC','CBBTC','STETH','WSTETH','RETH','XAUT','USDY','GT','PEARL','DRV']);

          async function getJson(url, timeout=7000) {
            for (let attempt=0; attempt<2; attempt++) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), timeout);
              try {
                const r = await fetch(url, {headers:{'Accept':'application/json','User-Agent':'MMP-QUANTUM-UNIVERSE-AUDIT/1.0'}, signal:controller.signal, cache:'no-store'});
                const body = await r.text();
                if (!r.ok) {
                  const error = new Error('HTTP '+r.status+' '+body.slice(0,160));
                  error.status = r.status;
                  if (attempt===0 && r.status===429) {
                    const retrySeconds=Number(r.headers.get('Retry-After'))||60;
                    await new Promise(resolve=>setTimeout(resolve,Math.min(90000,Math.max(60000,retrySeconds*1000))));
                    continue;
                  }
                  if (attempt===0 && [502,503,504].includes(r.status)) {
                    await new Promise(resolve=>setTimeout(resolve,1800));
                    continue;
                  }
                  throw error;
                }
                let data; try { data = JSON.parse(body); } catch { throw new Error('Invalid JSON '+body.slice(0,80)); }
                return data;
              } finally { clearTimeout(timer); }
            }
            throw new Error('Market API retry budget exhausted');
          }
          async function firstValid(candidates, tf) {
            const errors=[];
            let limitedHistory=null;
            for (const c of candidates) {
              try {
                const data=await getJson(c.url);
                const rows=c.rows(data);
                if (!Array.isArray(rows)) throw new Error('ساختار کندل نامعتبر است');
                if (rows.length < minRows(tf)) {
                  if ((tf==='1d'||fastIntervals.includes(tf)) && rows.length>=7 && (!limitedHistory || rows.length>limitedHistory.candles)) {
                    limitedHistory={ok:true,provider:c.name,candles:rows.length,limited_history:true,note:'تاریخچه روزانه کمتر از ۲۰ کندل است'};
                  }
                  throw new Error('کندل ناکافی: '+rows.length);
                }
                return {ok:true,provider:c.name,candles:rows.length,limited_history:false};
              } catch(e) { errors.push(c.name+': '+String(e.message||e).slice(0,140)); }
            }
            return limitedHistory || {ok:false,error:errors.join(' | ')};
          }
          const pairParts = pair => {
            const p=String(pair||'').toUpperCase();
            if(p.includes('_')){const [base,quote]=p.split('_');if(base&&quote)return {base,quote,compact:base+quote};}
            if(p.includes('-')){const parts=p.split('-');if(parts.length===2&&parts[0]&&parts[1])return {base:parts[0],quote:parts[1],compact:parts[0]+parts[1]};}
            for(const q of ['USDT','USDC','FDUSD','BUSD','USD','BTC','ETH'])if(p.endsWith(q)&&p.length>q.length)return {base:p.slice(0,-q.length),quote:q,compact:p};
            return null;
          };
          const rowsArray = x => Array.isArray(x);
          const spotCandidates = (pair,tf,support,preferredProvider) => {
            const p=pairParts(pair); if(!p) return [];
            const {base,quote,compact}=p, bybitTf={'1m':'1','3m':'3','5m':'5','15m':'15','1h':'60','4h':'240','1d':'D'}[tf], okxTf={'1m':'1m','3m':'3m','5m':'5m','15m':'15m','1h':'1H','4h':'4H','1d':'1Dutc'}[tf], bitgetTf={'1m':'1m','3m':'3m','5m':'5m','15m':'15m','1h':'1H','4h':'4H','1d':'1D'}[tf], kucoinTf={'1m':'1min','3m':'3min','5m':'5min','15m':'15min','1h':'1hour','4h':'4hour','1d':'1day'}[tf];
            const c=[];
            for(const host of ['https://api.binance.com','https://api1.binance.com','https://api2.binance.com','https://api3.binance.com','https://data-api.binance.vision']) c.push({name:'Binance Spot',url:host+'/api/v3/klines?symbol='+compact+'&interval='+tf+'&limit=250',rows:rowsArray});
            c.push({name:'Bitget Spot',url:'https://api.bitget.com/api/v3/market/candles?category=SPOT&symbol='+compact+'&interval='+bitgetTf+'&limit=250',rows:d=>(d?.code==='00000'||d?.code==='0')?d.data:null});
            for(const host of ['https://api.kucoin.com','https://api.kucoin.tr']) c.push({name:'KuCoin Spot',url:host+'/api/v1/market/candles?symbol='+base+'-'+quote+'&type='+kucoinTf,rows:d=>d?.code==='200000'?d.data:null});
            for(const host of ['https://api.gateio.ws','https://api.gate.us']) c.push({name:'Gate.io Spot',url:host+'/api/v4/spot/candlesticks?currency_pair='+base+'_'+quote+'&interval='+tf+'&limit=250',rows:rowsArray});
            for(const host of ['https://whitebit.com','https://whitebit.eu','https://whitebit.tr','https://whitebit.ge']) c.push({name:'WhiteBIT Spot',url:host+'/api/v1/public/kline?market='+base+'_'+quote+'&interval='+tf+'&limit=250',rows:d=>d?.success===true?d.result:null});
            for(const host of ['https://api.bybit.eu','https://api.bytick.eu','https://api.bybit.com','https://api.bytick.com']) c.push({name:'Bybit Spot',url:host+'/v5/market/kline?category=spot&symbol='+compact+'&interval='+bybitTf+'&limit=250',rows:d=>d?.retCode===0?d.result?.list:null});
            for(const host of ['https://www.okx.com','https://us.okx.com','https://openapi.okx.com']) c.push({name:'OKX Spot',url:host+'/api/v5/market/candles?instId='+base+'-'+quote+'&bar='+okxTf+'&limit=250',rows:d=>d?.code==='0'?d.data:null});
            const normalizeProvider=name=>name==="Gate"||name==="Gate.io"?"Gate.io":String(name||"");
            const preferred=normalizeProvider(preferredProvider);
            const supported=new Set([...(Array.isArray(support?.spot?.providers)?support.spot.providers:[]),preferred].filter(Boolean).map(normalizeProvider));
            if(!supported.size)return c.slice(0,4);
            const ordered=c.filter(x=>supported.has(x.name.replace(/ Spot$/,""))).sort((a,b)=>(a.name.startsWith(preferred)?-1:0)-(b.name.startsWith(preferred)?-1:0));
            const result=[],counts=new Map();
            for(const item of ordered){const name=item.name.replace(/ Spot$/,""),count=counts.get(name)||0;if(count>=2)continue;counts.set(name,count+1);result.push(item);}
            return result;
          };
          const futuresCandidates = (pair,tf,support) => {
            const p=pairParts(pair); if(!p) return [];
            const {base,quote,compact}=p, bybitTf={'1m':'1','3m':'3','5m':'5','15m':'15','1h':'60','4h':'240','1d':'D'}[tf], okxTf={'1m':'1m','3m':'3m','5m':'5m','15m':'15m','1h':'1H','4h':'4H','1d':'1Dutc'}[tf], bitgetTf={'1m':'1m','3m':'3m','5m':'5m','15m':'15m','1h':'1H','4h':'4H','1d':'1D'}[tf];
            const c=[];
            for(const host of ['https://api.gateio.ws','https://api.gate.us']) c.push({name:'Gate Futures',url:host+'/api/v4/futures/usdt/candlesticks?contract='+base+'_USDT&interval='+tf+'&limit=250',rows:rowsArray});
            c.push({name:'Bitget Futures',url:'https://api.bitget.com/api/v3/market/candles?category=USDT-FUTURES&symbol='+compact+'&interval='+bitgetTf+'&limit=250',rows:d=>d?.code==='00000'?d.data:null});
            for(const host of ['https://api.bybit.eu','https://api.bybit.com']) c.push({name:'Bybit Linear',url:host+'/v5/market/kline?category=linear&symbol='+compact+'&interval='+bybitTf+'&limit=250',rows:d=>d?.retCode===0?d.result?.list:null});
            for(const host of ['https://www.okx.com','https://us.okx.com']) c.push({name:'OKX Swap',url:host+'/api/v5/market/candles?instId='+base+'-'+quote+'-SWAP&bar='+okxTf+'&limit=250',rows:d=>d?.code==='0'?d.data:null});
            for(const host of ['https://fapi.binance.com','https://fapi1.binance.com']) c.push({name:'Binance Futures',url:host+'/fapi/v1/klines?symbol='+compact+'&interval='+tf+'&limit=250',rows:rowsArray});
            const supported=new Set(Array.isArray(support?.futures?.providers)?support.futures.providers:[]);
            return supported.size?c.filter(x=>supported.has(x.name.split(" ")[0])).slice(0,3):c;
          };
          async function checkWorkerCandles(pair, timeframe, market) {
            const parsed = pairParts(pair);
            if (!parsed) return {ok:false,error:"Invalid "+market+" pair: "+String(pair||"")};
            const url = WORKER + "/market-candles?symbol=" + encodeURIComponent(parsed.compact) + "&interval=" + encodeURIComponent(timeframe) + "&market=" + encodeURIComponent(market);
            const errors = [];
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const data = await getJson(url, 20000);
                const rows = Array.isArray(data.candles) ? data.candles : [];
                if (rows.length < minRows(timeframe)) throw new Error("Worker returned only " + rows.length + " candles");
                return {ok:true,provider:data.provider||"MMP Worker",candles:rows.length,data_stale:data.data_stale===true};
              } catch (error) {
                const message=String(error?.message||error);
                errors.push(message.slice(0,500));
                if (attempt < 2 && /HTTP (?:500|502|503|504)|timed out|abort|network|fetch failed/i.test(message)) {
                  await new Promise(resolve=>setTimeout(resolve, 1200*(attempt+1)));
                  continue;
                }
                break;
              }
            }
            return {ok:false,error:errors.join(" || ").slice(0,1200)};
          }
          async function checkAsset(asset, support, fastAudit=false) {
            const symbol=String(asset.symbol).toUpperCase();
            const spotMarkets=(Array.isArray(asset.marketPairs)?asset.marketPairs:[]).filter(x=>String(x.quote||"").toUpperCase()==="USDT"&&x.pair&&x.exchange).sort((a,b)=>Number(b.volume||0)-Number(a.volume||0));
            const preferredSpot=spotMarkets[0]||null;
            const spotPair=preferredSpot?.pair || support?.spot?.pair || symbol+"USDT";
            const futuresPair=support?.futures?.pair || symbol+"USDT";
            const tests=[];
            const timeframes=[...intervals,...(fastAudit?fastIntervals:[])];
            for(const tf of timeframes) {
              let result=await checkWorkerCandles(spotPair,tf,"spot");
              let market="spot";
              if(!result.ok && support?.futures?.confirmed) {
                const fut=await checkWorkerCandles(futuresPair,tf,"futures");
                if(fut.ok){result=fut;market="futures";}
                else result.error="Spot: "+result.error+" || Futures: "+fut.error;
              }
              tests.push({timeframe:tf,market,...result});
            }
            return {id:asset.id,name:asset.name,symbol,rank:asset.market_cap_rank||null,tests,ready:tests.every(x=>x.ok),fast_audit:fastAudit};
          }
          async function checkFuturesAsset(asset, fastAudit=false) {
            const symbol=String(asset.symbol||"").toUpperCase();
            const timeframes=fastAudit?[...intervals,...fastIntervals]:fastIntervals;
            const tests=[];
            for(const tf of timeframes)tests.push({timeframe:tf,market:"futures",...(await checkWorkerCandles(symbol+"USDT",tf,"futures"))});
            return {id:asset.id||("futures:"+symbol),name:asset.name||symbol,symbol,preferred:asset.hunterPriceExchange||null,venues:asset.hunterExchange||"",volume:Number(asset.volume)||0,tests,ready:tests.every(x=>x.ok),fast_audit:fastAudit};
          }
          (async()=>{
            const universe=await getJson(WORKER+'/hunter-universe',25000);
            const top=Array.isArray(universe.hunter_assets)?universe.hunter_assets:[];
            const futuresUniverse=await getJson(WORKER+'/hunter-futures-universe',25000);
            const futuresTop=Array.isArray(futuresUniverse.assets)?futuresUniverse.assets:[];
            const assetSource='MMP Quantum multi-exchange Spot and Futures universes';
            if(!top.length||!futuresTop.length)throw new Error('Spot or Futures universe returned no eligible USDT instruments');
            console.log('Spot universe: '+top.length+'; Futures universe: '+futuresTop.length);
            const map=new Map();
            top.forEach(c=>{
              if(!c?.id||!c?.symbol)return;
              const symbol=String(c.symbol).toUpperCase();
              if(nonTradableIds.has(c.id)||nonTradableSymbols.has(symbol)||map.has(symbol))return;
              map.set(symbol,{...c,symbol});
            });
            const candidates=[...map.values()].filter(x=>/^[A-Z0-9_]{2,30}$/.test(String(x.symbol||"").toUpperCase()));
            const supportMap={},supportSources={};
            for(let i=0;i<candidates.length;i+=120){
              const symbols=[...new Set(candidates.slice(i,i+120).map(x=>String(x.symbol).toUpperCase()))];
              const supportPayload=await getJson(WORKER+'/support-check?symbols='+encodeURIComponent(symbols.join(',')),30000);
              (supportPayload.assets||[]).forEach(x=>{supportMap[String(x.symbol||"").toUpperCase()]=x;});
              Object.assign(supportSources,supportPayload.sources||{});
            }
            if(!Object.values(supportSources).some(x=>x?.ok))throw new Error('Exchange catalogs unavailable; cannot verify tradable assets');
            const spotAssets=candidates.filter(x=>{
              const support=supportMap[String(x.symbol||"").toUpperCase()];
              const hasExactUsdtPair=Array.isArray(x.marketPairs)&&x.marketPairs.some(p=>String(p.quote||"").toUpperCase()==="USDT"&&p.pair);
              return !!support?.spot?.confirmed&&hasExactUsdtPair;
            }).sort((a,b)=>Number(b.volume||0)-Number(a.volume||0));
            const futuresAssets=futuresTop.filter(x=>{
              const symbol=String(x.symbol||"").toUpperCase();
              return /^[A-Z0-9]{2,20}$/.test(symbol)&&!nonTradableSymbols.has(symbol)&&String(x.hunterExchange||"").trim().length>0;
            }).sort((a,b)=>Number(b.volume||0)-Number(a.volume||0));
            if(!spotAssets.length||!futuresAssets.length)throw new Error('No confirmed Spot or Futures USDT instruments available for audit');
            const spotResults=[];
            for(let i=0;i<spotAssets.length;i+=4){
              const batch=spotAssets.slice(i,i+4);
              const rows=await Promise.all(batch.map(a=>checkAsset(a,supportMap[String(a.symbol).toUpperCase()],true)));
              spotResults.push(...rows);
              console.log('Checked Spot '+spotResults.length+'/'+spotAssets.length+' instruments');
            }
            const futuresResults=[];
            for(let i=0;i<futuresAssets.length;i+=4){
              const batch=futuresAssets.slice(i,i+4);
              const rows=await Promise.all(batch.map(a=>checkFuturesAsset(a,true)));
              futuresResults.push(...rows);
              console.log('Checked Futures '+futuresResults.length+'/'+futuresAssets.length+' instruments');
            }
            const spotFailed=spotResults.filter(x=>!x.ready),futuresFailed=futuresResults.filter(x=>!x.ready);
            const spotLimited=spotResults.filter(x=>x.tests.some(t=>t.limited_history)).length;
            const futuresLimited=futuresResults.filter(x=>x.tests.some(t=>t.limited_history)).length;
            const report={
              checked_at:new Date().toISOString(),source:assetSource,
              spot:{asset_count:spotResults.length,ready_count:spotResults.length-spotFailed.length,failed_count:spotFailed.length,limited_history_count:spotLimited,fast_interval_assets:spotResults.filter(x=>x.fast_audit).length,intervals:[...intervals,...fastIntervals],results:spotResults},
              futures:{asset_count:futuresResults.length,ready_count:futuresResults.length-futuresFailed.length,failed_count:futuresFailed.length,limited_history_count:futuresLimited,fast_interval_assets:futuresResults.filter(x=>x.fast_audit).length,intervals:[...fastIntervals,...intervals],results:futuresResults}
            };
            fs.writeFileSync('asset-audit.json',JSON.stringify(report,null,2));
            const md=['# MMP QUANTUM — ممیزی کامل Spot و Futures','', 'منبع: '+assetSource,'زمان بررسی: '+report.checked_at,'',
              '## Spot','تعداد: '+report.spot.ready_count+'/'+report.spot.asset_count+' آماده؛ '+report.spot.failed_count+' نیازمند بررسی؛ '+spotLimited+' تاریخچه محدود',
              '| ارز | نماد | 15m | 1h | 4h | 1d | 1m | 3m | 5m | نتیجه |','|---|---|---|---|---|---|---|---|---|---|'];
            for(const x of spotResults){
              const get=tf=>x.tests.find(t=>t.timeframe===tf);
              const cell=tf=>{const t=get(tf);return t?.limited_history?'محدود '+t.candles:(t?.provider||'—');};
              md.push('| '+x.name+' | '+x.symbol+' | '+cell('15m')+' | '+cell('1h')+' | '+cell('4h')+' | '+cell('1d')+' | '+cell('1m')+' | '+cell('3m')+' | '+cell('5m')+' | '+(x.ready?'آماده':'نیازمند اصلاح')+' |');
            }
            md.push('','## Futures','تعداد: '+report.futures.ready_count+'/'+report.futures.asset_count+' آماده؛ '+report.futures.failed_count+' نیازمند بررسی؛ '+futuresLimited+' تاریخچه محدود',
              '| ارز | نماد | بازارهای فعال | 1m | 3m | 5m | 15m | 1h | 4h | 1d | نتیجه |','|---|---|---|---|---|---|---|---|---|---|---|');
            for(const x of futuresResults){
              const get=tf=>x.tests.find(t=>t.timeframe===tf);
              const cell=tf=>{const t=get(tf);return t?.limited_history?'محدود '+t.candles:(t?.provider||'—');};
              md.push('| '+x.name+' | '+x.symbol+' | '+x.venues+' | '+cell('1m')+' | '+cell('3m')+' | '+cell('5m')+' | '+cell('15m')+' | '+cell('1h')+' | '+cell('4h')+' | '+cell('1d')+' | '+(x.ready?'آماده':'نیازمند اصلاح')+' |');
            }
            fs.writeFileSync('asset-audit.md',md.join('\n'));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md.join('\n')+'\n');
            console.log(JSON.stringify({spot:{checked:spotResults.length,ready:report.spot.ready_count,failed:report.spot.failed_count,failed_assets:spotFailed.map(x=>({symbol:x.symbol,tests:x.tests.filter(t=>!t.ok)}))},futures:{checked:futuresResults.length,ready:report.futures.ready_count,failed:report.futures.failed_count,failed_assets:futuresFailed.map(x=>({symbol:x.symbol,tests:x.tests.filter(t=>!t.ok)}))}},null,2));
            if(spotFailed.length||futuresFailed.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
