name: Build MMP COIN AI Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "index.html"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Copy the full dashboard into the Android app
        run: cp index.html www/index.html

      - name: Sync web configuration
        run: npx cap sync android

      - name: Build installable APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMP-COIN-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
