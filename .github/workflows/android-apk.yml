name: Build MMP COIN AI Android APK

on:
  push:
    branches: ["main"]
    paths:
      # Web UI and Worker changes ship through the live dashboard; rebuild only for native shell or dependency changes.
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "www/assets/mmp-coin-ai-icon.svg"
      - ".github/workflows/android-apk.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signing_ready: ${{ steps.prepare_signing.outputs.signing_ready }}
      app_version: ${{ steps.app_version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Read and preserve the current app version
        id: app_version
        run: |
          VERSION=$(node -e 'const fs=require("fs");const h=fs.readFileSync("www/index.html","utf8");const m=h.match(/<meta name="mmp-app-version" content="([^"]+)"/);if(!m)process.exit(1);process.stdout.write(m[1]);')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Visible app version remains $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor dependencies
        run: npm install

      - name: Configure secure live dashboard and native build version
        env:
          BUILD_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.server = {
            ...(config.server || {}),
            url: 'https://mmp-coin.github.io/?mmp_native_version=' + process.env.BUILD_VERSION,
            cleartext: false,
            allowNavigation: ['mmp-coin.github.io']
          };
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Verify and package the canonical dashboard, browser icon and manifest
        run: |
          test -s www/index.html
          grep -q 'id="mmp-sidebar"' www/index.html
          grep -q 'id="boom-hunter"' www/index.html
          grep -q 'MMP QUANTUM INTELLIGENCE NETWORK' www/index.html
          grep -q 'data-quantum-module="hunter"' www/index.html
          # www/ is the canonical web bundle. Do not bulk-copy root brand assets over it:
          # the root M coin mark is an older variant and would overwrite the current web artwork.
          test -s www/assets/mmp-coin-ai-icon.svg
          test -s www/assets/mmp-coin-mark.svg
          cmp manifest.webmanifest www/manifest.webmanifest
          echo "Canonical www brand assets and manifest verified; no legacy asset overwrite performed."

      - name: Stamp app version into the bundled dashboard
        env:
          BUILD_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'www/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace(/(<meta name="mmp-app-version" content=")[^"]*(")/, `$1${process.env.BUILD_VERSION}$2`);
          fs.writeFileSync(file, html);
          NODE

      - name: Generate Android launcher icons from MMP brand artwork
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const svg = fs.readFileSync('www/assets/mmp-coin-ai-icon.svg');
          (async () => {
            const densities = {
              mdpi: { icon: 48, foreground: 108 },
              hdpi: { icon: 72, foreground: 162 },
              xhdpi: { icon: 96, foreground: 216 },
              xxhdpi: { icon: 144, foreground: 324 },
              xxxhdpi: { icon: 192, foreground: 432 }
            };
            for (const [density, sizes] of Object.entries(densities)) {
              const dir = `android/app/src/main/res/mipmap-${density}`;
              fs.mkdirSync(dir, { recursive: true });
              for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
                await sharp(svg).resize(sizes.icon, sizes.icon).png().toFile(`${dir}/${name}`);
              }
              await sharp(svg).resize(sizes.foreground, sizes.foreground).png().toFile(`${dir}/ic_launcher_foreground.png`);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Prepare persistent Android signing key
        id: prepare_signing
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: |
          if [ -z "$ANDROID_SIGNING_CONFIG" ]; then
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "No persistent signing secret configured; building a debug APK only."
            exit 0
          fi
          echo "$ANDROID_SIGNING_CONFIG" | base64 --decode > /tmp/mmp-signing.json
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/mmp-signing.json', 'utf8'));
          if (!cfg.keystoreBase64 || !cfg.storePassword || !cfg.keyAlias || !cfg.keyPassword) {
            throw new Error('Android signing configuration is incomplete.');
          }
          fs.writeFileSync('android/app/mmp-release-key.jks', Buffer.from(cfg.keystoreBase64, 'base64'));
          NODE
          rm -f /tmp/mmp-signing.json
          echo "signing_ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure Android version and release signing
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: ${{ steps.app_version.outputs.version }}
          SIGNING_READY: ${{ steps.prepare_signing.outputs.signing_ready }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${process.env.BUILD_NUMBER}`);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${process.env.BUILD_VERSION}"`);
          if (process.env.SIGNING_READY === 'true') {
            gradle = gradle.replace(/buildTypes\s*\{\s*release\s*\{/, `signingConfigs {
                  release {
                      storeFile file("mmp-release-key.jks")
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release`);
          }
          fs.writeFileSync(file, gradle);
          NODE

      - name: Sync web configuration and native plugins
        run: npx cap sync android

      - name: Build installable APK
        env:
          SIGNING_READY: ${{ steps.prepare_signing.outputs.signing_ready }}
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: |
          cd android
          trap 'rm -f app/mmp-release-key.jks' EXIT
          if [ "$SIGNING_READY" = "true" ]; then
            export ANDROID_STORE_PASSWORD="$(node -e 'const c=JSON.parse(Buffer.from(process.env.ANDROID_SIGNING_CONFIG,"base64").toString("utf8"));process.stdout.write(c.storePassword)')"
            export ANDROID_KEY_ALIAS="$(node -e 'const c=JSON.parse(Buffer.from(process.env.ANDROID_SIGNING_CONFIG,"base64").toString("utf8"));process.stdout.write(c.keyAlias)')"
            export ANDROID_KEY_PASSWORD="$(node -e 'const c=JSON.parse(Buffer.from(process.env.ANDROID_SIGNING_CONFIG,"base64").toString("utf8"));process.stdout.write(c.keyPassword)')"
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MMP-COIN-AI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        if: ${{ steps.prepare_signing.outputs.signing_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MMP-COIN-AI-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-android
    if: ${{ needs.build-android.outputs.signing_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MMP-COIN-AI-Android-release
          path: dist

      - name: Publish signed update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: app-v${{ needs.build-android.outputs.app_version }}-build-${{ github.run_number }}
          target_commitish: main
          name: MMP COIN AI Android v${{ needs.build-android.outputs.app_version }} (build ${{ github.run_number }})
          files: dist/app-release.apk
          generate_release_notes: true
