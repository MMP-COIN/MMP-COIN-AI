name: Validate MMP Quantum Terminal

on:
  pull_request:
    branches: ["main"]
    paths:
      - "www/index.html"
      - "www/quantum-lab.html"
      - "www/market-heatmap.html"
      - "www/assets/mmp-quantum-terminal-v1.*"
      - ".github/workflows/validate-quantum-terminal.yml"
  push:
    branches: ["rebuild/quantum-terminal-v1"]
    paths:
      - "www/index.html"
      - "www/assets/mmp-quantum-terminal-v1.*"
      - ".github/workflows/validate-quantum-terminal.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validate terminal navigation JavaScript
        run: node --check www/assets/mmp-quantum-terminal-v1.js
      - name: Validate canonical homepage wiring and preserved market controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("www/index.html").read_text(encoding="utf-8")
          css = Path("www/assets/mmp-quantum-terminal-v1.css")
          js = Path("www/assets/mmp-quantum-terminal-v1.js")
          assert css.is_file() and css.stat().st_size > 1000, "Terminal stylesheet missing or unexpectedly small"
          assert js.is_file() and js.stat().st_size > 1000, "Terminal navigation script missing or unexpectedly small"
          assert 'mmp-quantum-terminal-v1.css' in html, "Terminal stylesheet is not linked"
          assert 'mmp-quantum-terminal-v1.js' in html, "Terminal navigation script is not linked"
          assert 'id="btn-irt"' in html and 'id="btn-usdt"' in html, "Toman/USDT primary switch was removed"
          assert 'id="usdt"' in html, "Live USDT/IRT quote target was removed"
          assert 'assets/mmp-coin-mark.svg' in html, "Original quantum M coin mark is not referenced"
          for page in ("www/quantum-lab.html", "www/market-heatmap.html"):
              assert "assets/mmp-coin-mark.svg" in Path(page).read_text(encoding="utf-8"), f"Canonical M coin mark missing from {page}"
          for required in ["mmp-home-hero", "market-snapshot", "quantum-center-entry", "opportunities", "market-hunter", "ai-section", "boom-hunter", "chart-section", "market-intelligence", "coins-section", "trading-tools", "exchange-connections", "market-hours"]:
              assert f'id="{required}"' in html, f"Existing feature mount missing: {required}"
          source = js.read_text(encoding="utf-8")
          centers = re.findall(r'^\s+([a-z]+):\{title:', source, re.M)
          assert len(centers) == 8, f"Expected eight centers, found {len(centers)}"
          print("Homepage wiring, original M coin, IRT/USDT controls, feature mounts, and eight-center map validated.")
          PY
