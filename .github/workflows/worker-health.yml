name: MMP COIN AI Worker Health Check
# Post-deploy verification for Worker version 154

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - "www/index.html"
      - "www/quantum-lab.html"
      - ".github/workflows/worker-health.yml"
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - "www/index.html"
      - "www/quantum-lab.html"
      - ".github/workflows/worker-health.yml"

permissions:
  contents: read

concurrency:
  group: worker-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Worker syntax and Quantum signal gates
        run: |
          set -euo pipefail
          node --check --input-type=module < cloudflare-worker/worker.js
          node --check --input-type=module < cloudflare-worker/radar-worker.js
          node --check --input-type=module < cloudflare-worker/quantum-core.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = fs.readFileSync("cloudflare-worker/quantum-core.js", "utf8");
          const mod = await import("data:text/javascript;base64," + Buffer.from(source).toString("base64"));
          const workerSource = fs.readFileSync("cloudflare-worker/worker.js", "utf8");
          if (!workerSource.includes("for(const url of urls)") || workerSource.includes("Promise.all(urls.map(url=>timeoutFetch")) throw new Error("Exchange health fallback must try alternate endpoints sequentially and stop after a verified response");
                    if (!workerSource.includes("async function fetchWithTimeout") || !workerSource.includes("return await fetch(url,{...options,signal:controller.signal})") || workerSource.includes("return await fetchWithTimeout(url,{...options,signal:controller.signal})")) throw new Error("Bounded fetch helper must call native fetch exactly once and must not recurse");
          if (!workerSource.includes('const MODEL = "@cf/openai/gpt-oss-120b"') || !workerSource.includes('reasoning_effort:"medium"});')) throw new Error("Cloudflare AI fallback must use GPT-OSS 120B with medium reasoning");
                    const groqStart = workerSource.indexOf('https://api.groq.com/openai/v1/chat/completions');
          const groqEnd = workerSource.indexOf("if(!response.ok)", groqStart);
          if (groqStart < 0 || groqEnd < 0 || workerSource.slice(groqStart, groqEnd).includes("response_format:")) throw new Error("Groq reasoning requests must use robust JSON extraction instead of forced JSON response mode");
                    const groqModelStart = workerSource.indexOf("const groqModels=[");
          const groqModelEnd = workerSource.indexOf("];", groqModelStart);
          const groqCascade = workerSource.slice(groqModelStart, groqModelEnd);
          if (groqModelStart < 0 || !groqCascade.includes('id:"openai/gpt-oss-120b"') || !groqCascade.includes('reasoning_effort:"medium"') || groqCascade.includes("qwen/") || groqCascade.includes("gpt-oss-20b")) throw new Error("Groq AI cascade must use one bounded GPT-OSS 120B model, avoiding rate-limited secondary models");
                    if (!workerSource.includes("function analyzeClosedKlines") || !workerSource.includes("داده کندل‌های بسته‌شده کافی نیست") || !workerSource.includes("marketDataFresh") || !workerSource.includes("const volumeConfirmed=") || !workerSource.includes("currentPrice:last[4]")) throw new Error("Analyzer must use closed candles, deterministic freshness/volume gates, and explicit price evidence");
          if (!workerSource.includes("const HUNTER_BATCH_SIZE = 10;") || !workerSource.includes("const FUTURES_HUNTER_BATCH_SIZE = 8;") || !workerSource.includes('const concurrency=marketType==="futures"?1:2;') || !workerSource.includes("Promise.allSettled(orderedSources.slice(offset,offset+2).map(fn=>fn()))")) throw new Error("Hunter scan budget/parallelism regression");
          if (!workerSource.includes("filter(x=>x.venues.size>=2)") || !workerSource.includes("x=>[+x[0]*1000,+x[5],+x[3],+x[4],+x[2],+x[1]]")) throw new Error("Futures venue qualification or Gate Spot OHLCV mapping regression");
          if (!workerSource.includes("QUALITY_REJECTED:") || !workerSource.includes("rejected_count:result.rejected||0") || !workerSource.includes("secondaryByTime=new Map(secondaryClosed.map(candle=>[candle[0],candle]));")) throw new Error("Shared-candle alignment or quality-rejection accounting missing");
          if (!workerSource.includes("failureCooldown") || !workerSource.includes("now+5*60*1000") || !workerSource.includes("now+2*60*1000")) throw new Error("Hunter failure quarantine/cursor progression missing");
          if (!workerSource.includes("candidate_count:0,scanned_count:0,failed_count:0,rejected_count:0,cooldown_count:0,universe_refreshed:true")) throw new Error("Universe refresh must clear stale scan metrics");
          const radarSource = fs.readFileSync("cloudflare-worker/radar-worker.js", "utf8");
          if (radarSource.includes("const verificationOrder=[...order,...fallback].slice(0,4)") || !radarSource.includes("Number(x[5]),Number(x[3]),Number(x[4]),Number(x[2]),Number(x[1])")) throw new Error("Radar exchange fallback or Gate Spot OHLCV mapping regression");
          if (workerSource.includes("order.map(index=>sources[index]).filter(Boolean).slice(0,4)") || workerSource.includes("[...new Set([...preferred,...sources.map((_,index)=>index)])].slice(0,4)")) throw new Error("Hunter exchange fallback list was artificially truncated");
          if (!workerSource.includes('const sourceLimit=marketType==="futures"?7:9') || !radarSource.includes("const verificationOrder=[...new Set([...order,...fallback])].slice(0,6);")) throw new Error("Multi-exchange fallback coverage regressed");
          for (const provider of ["contract.mexc.com","api-futures.kucoin.com","api/v2/mix/market/candles","api/v2/mix/market/fills","api.mexc.com/api/v3/klines"]) { if (!workerSource.includes(provider)) throw new Error("Market provider fallback missing: " + provider); }
          if (!radarSource.includes("https://api.mexc.com/api/v3/klines")) throw new Error("MEXC Spot radar fallback missing");
          const base = {trend:"bull",currentPrice:100,change1m:0.12,change3m:0.2,change5m:0.35,change15m:0.5,volumeRatio:1.3,breakout:true,structureAligned:true,trend15:true,overextended:false,dataAgeMs:20000,multiExchangeConfirmed:true,totalVolume24h:300000};
          const candidate = mod.scoreQuantumOpportunity({...base,flowConfirmed:false});
          if (!candidate.candidateGate || candidate.qualityGate) throw new Error("Preliminary candidate gate is incorrect");
          const confirmed = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12});
          if (!confirmed.qualityGate) throw new Error("Fully confirmed signal did not pass");
          const noDepth = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,requireDepthConfirmation:true,depthConfirmed:false});
          const withDepth = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,requireDepthConfirmation:true,depthConfirmed:true});
          if (noDepth.qualityGate || !withDepth.qualityGate) throw new Error("Order-book depth gate is incorrect");
          const rejected = [
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:-0.12}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,volumeRatio:0.9}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,multiExchangeConfirmed:false}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,overextended:true}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,dataAgeMs:200000}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,totalVolume24h:90000})
          ];
          if (rejected.some(result => result.qualityGate)) throw new Error("A weak/stale/unconfirmed candidate passed the quality gate");
          const missingEvidence = [
            mod.scoreQuantumOpportunity({trend:"bull",volumeRatio:2,totalVolume24h:500000,multiExchangeConfirmed:true,flowConfirmed:true,flowImbalance:0.2}),
            mod.scoreQuantumOpportunity({...base,dataAgeMs:undefined}),
            mod.scoreQuantumOpportunity({...base,currentPrice:0}),
            mod.scoreQuantumOpportunity({...base,change15m:undefined})
          ];
          if (missingEvidence.some(result => result.candidateGate || result.qualityGate)) throw new Error("Missing price, freshness, or timeframe evidence must never produce a candidate");
          if (missingEvidence[0].componentAvailability.multiTimeframe || missingEvidence[0].componentAvailability.dataQuality) throw new Error("Unavailable components must be marked unavailable, not neutral");
          if (!missingEvidence[1].missingEvidence.includes("dataAge")) throw new Error("Missing freshness evidence must be reported");

          console.log("Quantum candidate and confirmation gates: passed");
          NODE

      - name: Validate inline browser JavaScript and Hunter wiring
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("www/index.html", "utf8");
          const workerSource = fs.readFileSync("cloudflare-worker/worker.js", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (let i = 0; i < scripts.length; i++) {
            const attrs = scripts[i][1] || "";
            const type = (attrs.match(/\btype\s*=\s*["']([^"']+)/i) || [])[1] || "text/javascript";
            if (/\bsrc\s*=/.test(attrs) || /application\/(?:ld\+json|json)/i.test(type)) continue;
            new vm.Script(scripts[i][2], { filename: "www/index.html#inline-" + (i + 1) });
            checked++;
          }
          if (!html.includes("data-hunter-detail=") || !html.includes("slice(0,6)") || !html.includes("/market-flow?")) throw new Error("Hunter card, six-per-direction cap, or Radar flow wiring missing");
          if (!html.includes("while(!finished)") || !html.includes("hunterUniverseCache?.coins") || html.includes('pageNumbers=marketMetadataSource==="CoinLore"?[2,3,4,5,6,7,8,9,10]:[2,3,4,5]')) throw new Error("Full paginated market universe regression");
          if (workerSource.includes("requestedTopPage>5") || workerSource.includes("requestedOffset>5000")) throw new Error("Fixed market catalog page ceiling was reintroduced");
          console.log("Parsed " + checked + " inline browser scripts; Hunter UI wiring checks passed");
          NODE

      - name: Validate Quantum Lab runtime and multi-exchange wiring
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("www/quantum-lab.html", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (let i = 0; i < scripts.length; i++) {
            if (/\bsrc\s*=/.test(scripts[i][1])) continue;
            new vm.Script(scripts[i][2], { filename: "www/quantum-lab.html#inline-" + (i + 1) });
            checked++;
          }
          const required = ["/hunter-universe", "/hunter-scan", "/market-candles", "/market-orderflow"];
          const missing = required.filter(route => !html.includes(route));
          if (missing.length) throw new Error("Quantum Lab worker routes missing: " + missing.join(", "));
          if (html.includes("https://api.binance.com")) throw new Error("Quantum Lab still depends directly on Binance browser APIs");
          if (!html.includes('fetch(API+"/hunter-snapshot"') || !html.includes("function startLiveMonitor()") || !html.includes("setInterval(()=>{if(!document.hidden&&!state.busy)scan()},15000)")) throw new Error("Quantum Lab persistent automatic scan subscription is missing");
          if (!html.includes("flow?.complete===true") || !html.includes("depth?.confirmed===true")) throw new Error("Quantum Lab evidence quality gates are missing");
          if (!html.includes("MMP QUANTUM SUPER ENGINE") || !html.includes("۱۲ قابلیت تخصصی ابرموتور") || html.includes("mmp-quantum-engine-horizontal-final") || html.includes("#quantum-engines>#engines>.engine-drawer{flex:0 0 340px")) throw new Error("Quantum Lab must render one full-width super-engine panel, not a narrow horizontal engine carousel");
          const ids = new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]));
          const brokenHashLinks = [...new Set([...html.matchAll(/href=["']#([^"']+)["']/g)].map(x => x[1]).filter(id => !ids.has(id)))];
          if (brokenHashLinks.length) throw new Error("Quantum Lab navigation links have missing targets: " + brokenHashLinks.join(", "));
          const home = fs.readFileSync("www/index.html", "utf8");
          const homeIds = new Set([...home.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]));
          const brokenHomeLinks = [...new Set([...home.matchAll(/href=["']#([^"']+)["']/g)].map(x => x[1]).filter(id => !homeIds.has(id)))];
          if (brokenHomeLinks.length) throw new Error("Homepage menu links have missing targets: " + brokenHomeLinks.join(", "));


          if (!html.includes('content="2.0.0"')) throw new Error("Quantum Lab must preserve the installed app version");
          console.log("Quantum Lab inline scripts parsed: " + checked + "; multi-exchange routes and evidence gates passed.");
          NODE
      - name: Audit every public site and app module
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("www/index.html", "utf8");
          const modules = [...new Set([...html.matchAll(/data-quantum-module=["']([^"']+)["']/g)].map(x => x[1]))];
          const requiredModules = ["market-data","radar","hunter","analyzer","momentum","chart","intelligence","learning","alerts","assets","tools","global-clock","app","contact","signal-lab"];
          const missingModules = requiredModules.filter(x => !modules.includes(x));
          if (missingModules.length) throw new Error("Missing site modules: " + missingModules.join(", "));
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error("Duplicate DOM IDs: " + [...new Set(duplicates)].join(", "));
          const idSet = new Set(ids);
          const ariaRefs = [...html.matchAll(/\baria-(?:controls|labelledby|describedby)=["']([^"']+)["']/g)].flatMap(x => x[1].split(/\s+/));
          const brokenAria = [...new Set(ariaRefs.filter(id => !idSet.has(id)))];
          if (brokenAria.length) throw new Error("Broken accessibility references: " + brokenAria.join(", "));
          const requiredControls = ["refresh-all-btn","market-refresh-btn","hunter-refresh-btn","ai-coin-picker-trigger","ai-run-btn","boom-run","chart-fullscreen-btn","derivatives-load","orderflow-refresh","forecast-run","historical-backtest","journal-save","alert-add","risk-capital","risk-percent","risk-entry","risk-stop","risk-calc","connections-toggle","exchange-directory-refresh","native-menu-toggle","native-refresh-btn","native-update-check-btn","native-share-app"];
          const missingControls = requiredControls.filter(id => !idSet.has(id));
          if (missingControls.length) throw new Error("Missing core controls: " + missingControls.join(", "));
          if (/market-ticker|ticker-item|renderMarketTicker/.test(html)) throw new Error("Removed horizontal market ticker code has returned");
          if (!html.includes("probeDirectFallback(checks.get(\"binance spot\")") || !html.includes("probeDirectFallback(checks.get(\"nobitex\")") || !html.includes("probeDirectFallback(checks.get(\"kucoin spot\")")) throw new Error("Homepage must try independent browser fallback routes for down exchanges");
                    if (html.includes("checkNativeApkUpdate") || !html.includes("function checkNativeUpdate(manual){checkLivePageUpdate(!!manual);}")) throw new Error("Native app update must remain internal-only and must not require a new APK");
          if (!html.includes("params.set('mmp_live_refresh',String(Date.now()))") || !html.includes("mmp_native_version")) throw new Error("Native live-page cache refresh is missing");
          const version = html.match(/<meta name=["']mmp-app-version["'] content=["']([^"']+)["']/i);
          if (!version) throw new Error("Native app version metadata is missing");
          console.log("Audited " + requiredModules.length + " required modules, " + ids.length + " IDs, accessibility links and " + requiredControls.length + " core controls; app version " + version[1] + " retained.");
          NODE
      - name: Check Worker health endpoint
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 25 "$WORKER_URL/health" -o /tmp/health.json
          jq -e '.worker == "online" and .ai_binding == true and .futures_engine_binding == true' /tmp/health.json >/dev/null
          {
            echo "## Worker health"
            echo "- Worker: online"
            echo "- AI binding: available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Futures service and live Quantum snapshots
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
          FUTURES_URL: https://mmp-coin-ai-futures.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$FUTURES_URL/health" -o /tmp/futures-health.json
          jq -e '.status == "online" and .market == "futures" and .d1 == true' /tmp/futures-health.json >/dev/null
          for endpoint in hunter-snapshot hunter-futures-snapshot; do
            output="/tmp/${endpoint}.json"
            status=$(curl --silent --show-error --max-time 20 -o "$output" -w "%{http_code}" "$WORKER_URL/$endpoint" || true)
            echo "Endpoint $endpoint: HTTP $status"
            cat "$output" || true
            test "$status" = "200"
            jq -e '(.status == "online" or .status == "warming_up") and (.universe_count // 0) > 0' "$output" >/dev/null
          done
          cp /tmp/hunter-snapshot.json /tmp/spot-hunter.json
          cp /tmp/hunter-futures-snapshot.json /tmp/futures-hunter.json
          {
            echo "- Quantum Spot universe: $(jq -r '.universe_count' /tmp/spot-hunter.json) assets; last batch $(jq -r '.scanned_count // 0' /tmp/spot-hunter.json) scanned"
            echo "- Quantum Futures universe: $(jq -r '.universe_count' /tmp/futures-hunter.json) contracts; last batch $(jq -r '.scanned_count // 0' /tmp/futures-hunter.json) scanned; $(jq -r '.failed_count // 0' /tmp/futures-hunter.json) failures"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test deployed five-provider Quantum Hunter
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 1 --retry-delay 3 --max-time 90 "$WORKER_URL/hunter-scan?market=spot&symbols=BTC%2CETH%2CSOL%2CXRP" -o /tmp/five-provider-hunter.json
          jq -e '.requested == 4 and (.scanned // 0) >= 2 and (.failed // 4) <= 2' /tmp/five-provider-hunter.json >/dev/null
          jq -r '"Deployed five-provider Hunter: " + (.scanned|tostring) + "/4 scanned; " + (.candidates|tostring) + " preliminary candidates; " + (.failed|tostring) + " data failures; " + (.signals|length|tostring) + " confirmed signals." ' /tmp/five-provider-hunter.json
          curl --fail --silent --show-error --retry 1 --retry-delay 3 --max-time 120 "$WORKER_URL/hunter-scan?market=futures&symbols=BTC%2CETH%2CWLD%2CENA%2CPUMP%2CICNT" -o /tmp/futures-provider-hunter.json
          jq -e '.requested == 6 and (.scanned // 0) >= 4 and (.failed // 6) <= 2' /tmp/futures-provider-hunter.json >/dev/null
          jq -r '"Deployed Futures fallback: " + (.scanned|tostring) + "/6 scanned; " + (.failed|tostring) + " data failures; " + (.signals|length|tostring) + " flow-confirmed signals." ' /tmp/futures-provider-hunter.json
      - name: Verify scheduled Spot and Futures hunter cycles
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --max-time 15 -o /tmp/hunter-cron-status.json -w "%{http_code}" "$WORKER_URL/hunter-cron-status" || true)
            if [ "$status" = "200" ] && jq -e '(.status == "success" or .status == "partial") and (.markets.spot.universe // 0) > 0 and (.markets.futures.universe // 0) > 0 and ((.markets.spot.scanned // 0) > 0 or (.markets.spot.universe_refreshed // false)) and ((.markets.futures.scanned // 0) > 0 or (.markets.futures.universe_refreshed // false)) and (.errors | length == 0)' /tmp/hunter-cron-status.json >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/hunter-cron-status.json || true
            echo "Scheduled Spot/Futures cycle is not fully healthy." >&2
            exit 1
          fi
          jq -r '"Scheduled Quantum cycle: Spot " + (.markets.spot.scanned|tostring) + "/" + (.markets.spot.universe|tostring) + " (failed " + (.markets.spot.failed|tostring) + ", rejected " + (.markets.spot.rejected|tostring) + ", refresh " + (.markets.spot.universe_refreshed|tostring) + "); Futures " + (.markets.futures.scanned|tostring) + "/" + (.markets.futures.universe|tostring) + " (failed " + (.markets.futures.failed|tostring) + ", rejected " + (.markets.futures.rejected|tostring) + ", refresh " + (.markets.futures.universe_refreshed|tostring) + "); status " + .status' /tmp/hunter-cron-status.json
          echo "- Scheduled Spot and Futures engines: both completed a live scan without cycle errors" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify independent server-side fast radar scan
        env:
          RADAR_WORKER_URL: https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$RADAR_WORKER_URL/health" -o /tmp/radar-health.json
          jq -e '.worker == "online" and .kv == true' /tmp/radar-health.json >/dev/null
          ready=false
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --max-time 15 -o /tmp/radar-snapshot.json -w "%{http_code}" "$RADAR_WORKER_URL/fast-radar-snapshot" || true)
            if [ "$status" = "200" ] && jq -e '.status == "online" and (.universe_count // 0) > 0 and (.scanned_count // 0) > 0' /tmp/radar-snapshot.json >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/radar-snapshot.json || true
            echo "Independent radar has not completed a live scan." >&2
            exit 1
          fi
          jq -r '"Independent radar: scanned " + (.scanned_count|tostring) + "/" + (.universe_count|tostring) + "; active signals " + ((.signals|length)|tostring)' /tmp/radar-snapshot.json
          echo "- Independent server-side radar: live scan and snapshot verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Check private analytics Worker
        env:
          ADMIN_WORKER_URL: https://mmp-coin-ai-admin.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$ADMIN_WORKER_URL/health" -o /tmp/admin-health.json
          jq -e '.worker == "mmp-coin-ai-admin" and .status == "online"' /tmp/admin-health.json >/dev/null
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$ADMIN_WORKER_URL/admin/api/session" -o /tmp/admin-session.json
          jq -e '.authenticated == false' /tmp/admin-session.json >/dev/null
          echo "- Private analytics Worker: online; admin API responds without a session" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose exchange API access from GitHub runner
        continue-on-error: true
        run: |
          set -u
          probe() {
            label="$1"
            url="$2"
            shift 2
            code=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "$@" "$url" || true)
            echo "$label: HTTP $code"
          }
          probe "Bybit EU" "https://api.bybit.eu/v5/market/tickers?category=spot&symbol=BTCUSDT"
          probe "Bybit EU alternate" "https://api.bytick.eu/v5/market/tickers?category=spot&symbol=BTCUSDT"
          probe "Bybit global" "https://api.bybit.com/v5/market/tickers?category=spot&symbol=BTCUSDT"
          probe "Wallex with browser headers" "https://api.wallex.ir/v1/markets" -H "Origin: https://wallex.ir" -H "Referer: https://wallex.ir/"
          probe "Bitget Spot" "https://api.bitget.com/api/v3/market/tickers?category=SPOT&symbol=BTCUSDT"
          probe_cors() {
            label="$1"
            url="$2"
            status=$(curl --silent --show-error --max-time 15 -D /tmp/market-headers -o /dev/null -w "%{http_code}" -H "Origin: https://mmp-coin.github.io" -H "Referer: https://mmp-coin.github.io/" "$url" || true)
            allow=$(grep -i "^access-control-allow-origin:" /tmp/market-headers | tail -1 | tr -d "\r" | cut -d ":" -f2- | xargs || true)
            echo "$label browser-CORS: HTTP $status; allow-origin=${allow:-missing}"
          }
          probe_cors "Wallex" "https://api.wallex.ir/v1/markets"
          probe_cors "Bitget" "https://api.bitget.com/api/v3/market/tickers?category=SPOT&symbol=BTCUSDT"

      - name: Check exchange connection monitor
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 25 "$WORKER_URL/connections-health" -o /tmp/connections.json
          jq -e '.checks | length == 8' /tmp/connections.json >/dev/null
          echo "Current exchange connection status:"
          jq -r '.checks[] | "- " + .name + ": " + .status + (if .ping == null then "" else " (" + (.ping|tostring) + " ms)" end) + (if .error == null then "" else " — " + (.error|tostring) end)' /tmp/connections.json
          jq -r '.checks[] | "- " + .name + ": " + .status + (if .ping == null then "" else " (" + (.ping|tostring) + " ms)" end) + (if .error == null then "" else " — " + (.error|tostring) end)' /tmp/connections.json >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'any(.checks[]; .status == "ok")' /tmp/connections.json >/dev/null; then
            echo "No exchange data source is currently healthy." >&2
            exit 1
          fi

      - name: Check expanded multi-exchange hunter universe
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 55 "$WORKER_URL/hunter-universe" -o /tmp/hunter-universe.json -w "%{http_code}")
          if [ "$status" != "200" ]; then cat /tmp/hunter-universe.json; exit 1; fi
          jq -e '.universe_mode == "unified_catalog_plus_independent_exchange_discovery" and (.assets | type == "array") and (.hunter_assets | type == "array" and length > 0) and (.sources | has("WhiteBIT") and has("Nobitex") and has("Wallex"))' /tmp/hunter-universe.json >/dev/null
          count=$(jq '.assets | length' /tmp/hunter-universe.json)
          hunter_count=$(jq '.hunter_assets | length' /tmp/hunter-universe.json)
          discovered=$(jq '.discovered_count // 0' /tmp/hunter-universe.json)
          venues=$(jq -r '[.hunter_assets[].hunterExchange | split(", ")[]] | unique | join(", ")' /tmp/hunter-universe.json)
          echo "- Canonical catalog: $count assets; independent Hunter universe: $hunter_count instruments ($discovered outside metadata catalog) across $venues" >> "$GITHUB_STEP_SUMMARY"

      - name: Check market data proxy
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          binance_status=$(curl --silent --show-error --retry 1 --max-time 25 -o /tmp/binance.json -w "%{http_code}" "$WORKER_URL/market-proxy?source=binance-tickers")
          echo "Binance ticker proxy HTTP $binance_status"
          if [ "$binance_status" != "200" ]; then jq -r '.detail // .error // .' /tmp/binance.json; exit 1; fi
          jq -e 'type == "array" and any(.[]; .symbol == "BTCUSDT")' /tmp/binance.json >/dev/null
          coingecko_status=$(curl --silent --show-error --retry 1 --max-time 25 -o /tmp/coingecko.json -w "%{http_code}" "$WORKER_URL/market-proxy?source=coingecko-top")
          echo "CoinGecko market proxy HTTP $coingecko_status"
          if [ "$coingecko_status" = "200" ]; then
            jq -e 'type == "array" and length > 0' /tmp/coingecko.json >/dev/null
            echo "- CoinGecko market proxy: responding" >> "$GITHUB_STEP_SUMMARY"
          else
            detail=$(jq -r '.detail // .error // .' /tmp/coingecko.json)
            if ! echo "$detail" | grep -q "429"; then echo "$detail"; exit 1; fi
            echo "::warning::CoinGecko rate limited the shared Worker IP (HTTP 429); cached/alternate prices remain available."
            echo "- CoinGecko market proxy: rate-limited (HTTP 429)" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "- Binance ticker proxy: responding"
            echo "- Bitget direct API: checked separately with browser CORS"
          } >> "$GITHUB_STEP_SUMMARY"
          coincap_status=$(curl --silent --show-error --max-time 25 -o /tmp/coincap.json -w "%{http_code}" "$WORKER_URL/market-proxy?source=coinlore-top&offset=0")
          echo "CoinLore fallback proxy HTTP $coincap_status"
          if [ "$coincap_status" != "200" ]; then jq -r '.detail // .error // .' /tmp/coincap.json; exit 1; fi
          jq -e '.data | type == "array" and length >= 100 and any(.[]; ((.price_usd // "0") | tonumber) > 0)' /tmp/coincap.json >/dev/null
          echo "- CoinLore fallback proxy: responding with ranked assets and live USD prices" >> "$GITHUB_STEP_SUMMARY"
 
      - name: Smoke-test live spot candlestick endpoint
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          status=$(curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 35 -o /tmp/candles.json -w "%{http_code}" "$WORKER_URL/market-candles?symbol=BTC&interval=15m")
          echo "Live candle endpoint HTTP $status"
          jq -e '.symbol == "BTCUSDT" and .interval == "15m" and (.candles | length >= 30) and (.provider | type == "string" and length > 0) and (.candles[0].open > 0)' /tmp/candles.json >/dev/null
          local_status=$(curl --silent --show-error --max-time 25 -o /tmp/local-candles.json -w "%{http_code}" "$WORKER_URL/market-candles?symbol=BTCIRT&interval=1h")
          echo "Nobitex local Spot candle endpoint HTTP $local_status"
          if [ "$local_status" != "200" ]; then cat /tmp/local-candles.json; exit 1; fi
          jq -e '.symbol == "BTCIRT" and .provider == "Nobitex Spot" and (.candles | length >= 30) and (.candles[0].open > 0)' /tmp/local-candles.json >/dev/null
          {
            echo "- Live global Spot candlesticks: responding with real OHLCV data"
            echo "- Live Nobitex IRT candlesticks: responding with real OHLCV data"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Run and verify the scheduled Quantum Hunter snapshot
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          run_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 85 -o /tmp/hunter-run.json -w "%{http_code}" "$WORKER_URL/hunter-run")
          echo "Quantum Hunter cycle HTTP $run_status"
          if [ "$run_status" != "200" ]; then cat /tmp/hunter-run.json; exit 1; fi
          jq -e '.status == "online" and .engine == "MMP QUANTUM INTELLIGENCE ENGINE" and (.universe_count > 0) and (.batch_size > 0) and (.signals | type == "array")' /tmp/hunter-run.json >/dev/null
          snapshot_status=$(curl --fail --silent --show-error --max-time 15 "$WORKER_URL/hunter-snapshot" -o /tmp/hunter-snapshot.json -w "%{http_code}")
          test "$snapshot_status" = "200"
          jq -e '.status == "online" and .engine == "MMP QUANTUM INTELLIGENCE ENGINE" and (.signals | type == "array")' /tmp/hunter-snapshot.json >/dev/null
          jq -r '"Quantum Hunter snapshot: scanned " + (.scanned_count|tostring) + "/" + (.universe_count|tostring) + " liquid instruments; " + (.signals|length|tostring) + " confirmed signals; failures " + (.failed_count|tostring)' /tmp/hunter-snapshot.json >> "$GITHUB_STEP_SUMMARY"

      - name: Verify 1m/3m/5m and Futures candle endpoints
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          for spec in "spot 3m" "spot 5m" "futures 15m"; do
            read -r market interval <<< "$spec"
            status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 35 -o "/tmp/candles-$market-$interval.json" -w "%{http_code}" "$WORKER_URL/market-candles?market=$market&symbol=BTC&interval=$interval")
            echo "$market $interval candles HTTP $status"
            if [ "$status" != "200" ]; then cat "/tmp/candles-$market-$interval.json"; exit 1; fi
            jq -e '.symbol == "BTCUSDT" and .market == "'$market'" and .interval == "'$interval'" and (.candles | length >= 30) and (.provider | type == "string" and length > 0) and (.candles[0].open > 0)' "/tmp/candles-$market-$interval.json" >/dev/null
            jq -r '"$market $interval provider: " + .provider + " | candles: " + (.candles|length|tostring)' "/tmp/candles-$market-$interval.json"
          done
          echo "- Spot 3m/5m and Futures 15m OHLCV endpoints: verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test Spot/Futures trade flow, order book and analysis
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          for market in spot futures; do
            flow_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 30 -o "/tmp/flow-$market.json" -w "%{http_code}" "$WORKER_URL/market-flow?market=$market&symbol=BTC&window=5")
            echo "$market real-trade flow HTTP $flow_status"
            if [ "$flow_status" != "200" ]; then cat "/tmp/flow-$market.json"; exit 1; fi
            jq -e '.symbol == "BTCUSDT" and (.trade_count | type == "number") and (.trade_count > 0) and (.buy5m >= 0) and (.sell5m >= 0) and (.provider | type == "string" and length > 0) and (.complete | type == "boolean")' "/tmp/flow-$market.json" >/dev/null
            jq -r '"$market trade-flow: " + .provider + " | " + (.trade_count|tostring) + " trades | complete=" + (.complete|tostring)' "/tmp/flow-$market.json"
          done
          for market in spot futures; do
            orderflow_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 35 -o "/tmp/orderflow-$market.json" -w "%{http_code}" "$WORKER_URL/market-orderflow?market=$market&symbol=BTC")
            echo "$market order-book/flow HTTP $orderflow_status"
            if [ "$orderflow_status" != "200" ]; then cat "/tmp/orderflow-$market.json"; exit 1; fi
            jq -e '.market == "'$market'" and (.depth.available == true) and (.depth.source | type == "string") and (.flow.available == true) and (.flow.trade_count > 0) and (.flow.source | type == "string")' "/tmp/orderflow-$market.json" >/dev/null
            jq -r '"$market order book: " + .depth.source + " | trade flow: " + .flow.source + " | trades: " + (.flow.trade_count|tostring) + " | complete=" + (.flow.complete|tostring)' "/tmp/orderflow-$market.json"
          done
          support_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 35 -o /tmp/futures-support.json -w "%{http_code}" "$WORKER_URL/support-check?symbols=BTC,ETH")
          echo "Multi-exchange Futures support HTTP $support_status"
          if [ "$support_status" != "200" ]; then cat /tmp/futures-support.json; exit 1; fi
          jq -e '.assets | length == 2 and all(.[]; .futures.confirmed == true and (.futures.providers | length >= 2))' /tmp/futures-support.json >/dev/null
          jq -r '.assets[] | .symbol + " Futures venues: " + (.futures.providers|join(", "))' /tmp/futures-support.json
          futures_universe_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 25 -o /tmp/futures-universe.json -w "%{http_code}" "$WORKER_URL/hunter-futures-universe")
          echo "Full Futures universe HTTP $futures_universe_status"
          if [ "$futures_universe_status" != "200" ]; then cat /tmp/futures-universe.json; exit 1; fi
          jq -e '. as $u | $u.status == "online" and ($u.universe_count >= 100) and ($u.assets | length == $u.universe_count) and all($u.assets[]; (.hunterExchange | type == "string" and length > 0))' /tmp/futures-universe.json >/dev/null
          jq -r '"Futures universe: " + (.universe_count|tostring) + " active contracts from " + (.source // "multiple exchanges")' /tmp/futures-universe.json
          derivatives_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 35 -o /tmp/derivatives.json -w "%{http_code}" "$WORKER_URL/market-derivatives?symbol=BTC")
          echo "Futures derivatives endpoint HTTP $derivatives_status"
          if [ "$derivatives_status" != "200" ]; then cat /tmp/derivatives.json; exit 1; fi
          # market-derivatives returns the base ticker (BTC), unlike candle/flow routes (BTCUSDT).
          jq -e '.symbol == "BTC" and (.source | type == "string" and length > 0) and ((.funding_rate == null or (.funding_rate | type == "number")) and (.open_interest == null or (.open_interest | type == "number")))' /tmp/derivatives.json >/dev/null
          if jq -e '(.funding_rate != null or .open_interest != null)' /tmp/derivatives.json >/dev/null; then
            jq -r '"Futures derivatives source: " + (.source // "multi-source")' /tmp/derivatives.json
          else
            echo "::warning::Derivatives endpoint responded but did not provide funding/open-interest values for BTC in this run."
          fi
          hunter_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 50 -o /tmp/hunter-scan.json -w "%{http_code}" "$WORKER_URL/hunter-scan?symbols=BTC,ETH")
          echo "Independent Spot Hunter scan HTTP $hunter_status"
          if [ "$hunter_status" != "200" ]; then cat /tmp/hunter-scan.json; exit 1; fi
          cat /tmp/hunter-scan.json
          jq -e '.engine == "MMP QUANTUM INTELLIGENCE ENGINE" and .requested == 2 and (.signals | type == "array")' /tmp/hunter-scan.json >/dev/null
          jq -e '[.signals[] | select(.confirmed != true or .quantum.engine != "MMP QUANTUM INTELLIGENCE ENGINE" or .flow.complete != true or (.flow.provider | type != "string"))] | length == 0' /tmp/hunter-scan.json >/dev/null
          jq -r '.errors[]? | "Spot Hunter diagnostic: " + .symbol + " · " + .error' /tmp/hunter-scan.json
          jq -r '"Quantum Spot Hunter: " + (.scanned|tostring) + " symbols checked; " + (.signals|length|tostring) + " flow-confirmed signals"' /tmp/hunter-scan.json
          futures_status=$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 60 -o /tmp/hunter-futures-scan.json -w "%{http_code}" "$WORKER_URL/hunter-scan?market=futures&symbols=BTC,ETH")
          echo "Independent Futures Hunter scan HTTP $futures_status"
          if [ "$futures_status" != "200" ]; then cat /tmp/hunter-futures-scan.json; exit 1; fi
          cat /tmp/hunter-futures-scan.json
          jq -e '.engine == "MMP QUANTUM INTELLIGENCE ENGINE" and .market == "futures" and .requested == 2 and (.signals | type == "array")' /tmp/hunter-futures-scan.json >/dev/null
          jq -e '[.signals[] | select(.market != "futures" or .confirmed != true or .quantum.engine != "MMP QUANTUM INTELLIGENCE ENGINE" or .flow.complete != true or (.flow.provider | type != "string"))] | length == 0' /tmp/hunter-futures-scan.json >/dev/null
          jq -r '.errors[]? | "Futures Hunter diagnostic: " + .symbol + " · " + .error' /tmp/hunter-futures-scan.json
          jq -r '"Quantum Futures Hunter: " + (.scanned|tostring) + " symbols checked; " + (.signals|length|tostring) + " flow-confirmed signals"' /tmp/hunter-futures-scan.json
          {
            echo "- Spot/Futures real trade flow and order books: live sources verified"
            echo "- BTC/ETH Futures support: multiple active venues verified"
            echo "- Futures derivatives: funding/open-interest endpoint verified"
            echo "- Independent Spot and Futures scans: valid responses and confirmation quality checked"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test market intelligence endpoints
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
