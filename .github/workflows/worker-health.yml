name: MMP COIN AI Worker Health Check
# Post-deploy verification for QIE-4.0.0 and integrated learning

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - "www/index.html"
      - "www/quantum-lab.html"
      - ".github/workflows/worker-health.yml"

permissions:
  contents: read

concurrency:
  group: worker-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Smoke-test Hunter universe refresher Worker
        if: github.ref == 'refs/heads/main'
        env:
          CRON_URL: https://mmp-coin-ai-hunter-cron.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 "$CRON_URL/health")"
          echo "$body"
          echo "$body" | jq -e '.status == "online" and .engine_version == "QIE-4.0.0"'
      - name: Validate Hunter universe refresher and Cron scan budgets
        run: |
          set -euo pipefail
          node --check cloudflare-worker/hunter-cron-worker.js
          node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("cloudflare-worker/hunter-cron-worker.js", "utf8");
          for (const required of ["refreshDigitalHunterUniverses", "digital-hunter-universe-refresh", "hourly-universe-refresh", "async scheduled(event,env)"]) {
            if (!source.includes(required)) throw new Error("Dedicated Hunter scheduler missing: " + required);
          }
          console.log("Dedicated universe refresh worker verified.");
          NODE
      - name: Validate Worker syntax and Quantum signal gates
        run: |
          set -euo pipefail
          node --check --input-type=module < cloudflare-worker/worker.js
          node --check --input-type=module < cloudflare-worker/radar-worker.js
          node --check --input-type=module < cloudflare-worker/quantum-core.js
          node --check --input-type=module < cloudflare-worker/market-data-core.js
          node --check --input-type=module < cloudflare-worker/learning-engine.js
          node --check --input-type=module < cloudflare-worker/futures-worker.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = fs.readFileSync("cloudflare-worker/quantum-core.js", "utf8");
          const mod = await import("data:text/javascript;base64," + Buffer.from(source).toString("base64"));
          if (mod.QUANTUM_ENGINE_VERSION !== "QIE-4.0.0" || typeof mod.calculateQuantumIndicators !== "function") throw new Error("QIE 4 technical-indicator engine is missing");
          if (typeof mod.calculateMarketScanPriority !== "function") throw new Error("Shared market-mover priority engine is missing");
          const activeMover = mod.calculateMarketScanPriority({hunterChange24h:20,total_volume:35000000});
          const megaLiquid = mod.calculateMarketScanPriority({hunterChange24h:0,total_volume:2000000000});
          if (!(activeMover > megaLiquid)) throw new Error("Active movers must be prioritized ahead of static high-volume assets");
          const bars = Array.from({length:100},(_,i)=>{const c=100+i*.12+Math.sin(i/4)*.3;return [1700000000000+i*60000,c-.04,c+.2,c-.2,c,1000+i*3];});
          const early = mod.detectEarlyMovePressure({rangeCompression:0.2,volumeAcceleration:3.0,flowImbalance:-0.9,dataFresh:true});
          if (early.state !== "high_pressure" || early.direction !== "down" || early.available_inputs !== 3) throw new Error("Early downside pressure detector failed");
          const staleEarly = mod.detectEarlyMovePressure({rangeCompression:0.5,volumeAcceleration:2.0,flowImbalance:0.7,dataFresh:false});
          if (staleEarly.state !== "insufficient_data") throw new Error("Early pressure must fail closed on stale data");
          const indicators = mod.calculateQuantumIndicators(bars);
          if (!indicators.available || !Number.isFinite(indicators.rsi14) || !Number.isFinite(indicators.ema50) || !Number.isFinite(indicators.macdHistogram) || !Number.isFinite(indicators.atrPct) || !Number.isFinite(indicators.vwap)) throw new Error("QIE 4 RSI/EMA/MACD/ATR/VWAP calculation failed");
          const marketSource = fs.readFileSync("cloudflare-worker/market-data-core.js", "utf8");
          const market = await import("data:text/javascript;base64," + Buffer.from(marketSource).toString("base64"));
          const candleTime = 1700000000000;
          const cleanCandles = market.normalizeMarketCandles([[candleTime+60000,101,103,100,102,12],[candleTime,100,102,99,101,10],[candleTime,100,102,99,101.2,11],[candleTime+120000,0,0,0,0,0]]);
          if (cleanCandles.length !== 2 || cleanCandles[0][4] !== 101.2) throw new Error("Shared candle validation/deduplication failed");
          const aligned = market.alignMarketCandles(cleanCandles,[[candleTime,100.1,102,99,101.1,10],[candleTime+60000,101.1,103,100,102.1,12]],{now:candleTime+180000,maxAgeMs:180000,maxDeviationPct:0.4});
          if (!aligned || aligned.index !== 1 || aligned.deviationPct > 0.4) throw new Error("Shared multi-exchange candle alignment failed");
          if (!market.assessMarketDataFreshness(candleTime+60000,candleTime+120000,180000).fresh || market.assessMarketDataFreshness(candleTime,candleTime+300000,180000).fresh) throw new Error("Shared market-data freshness gate failed");
          const learningSource = fs.readFileSync("cloudflare-worker/learning-engine.js", "utf8");
          const learning = await import("data:text/javascript;base64," + Buffer.from(learningSource).toString("base64"));
          const start = 1700000000000;
          const signal = {symbol:"BTC",trend:"bull",price:100,candleTime:start,score:75,flowConfirmed:true,multiExchangeConfirmed:true,depth:{confirmed:true},quantum:{qualityGate:true,confidence:70,version:"QIE-4.0.0"}};
          const ledgerA = learning.updateLearningLedger({}, {observations:[],signals:[signal],market:"spot",engine:"test",now:start});
          const ledgerB = learning.updateLearningLedger(ledgerA, {observations:[{symbol:"BTC",price:101}],signals:[],market:"spot",engine:"test",now:start+6*60000});
          if (ledgerB.records.length !== 1 || !(ledgerB.records[0].outcome_5m > 0) || ledgerB.summary.matured5m !== 1) throw new Error("Persistent signal outcome learning failed");
          const lateLedgerA = learning.updateLearningLedger({}, {observations:[],signals:[signal],market:"spot",engine:"late-test",now:start});
          const lateLedgerB = learning.updateLearningLedger(lateLedgerA, {observations:[{symbol:"BTC",price:105}],signals:[],market:"spot",engine:"late-test",now:start+20*60000});
          if (lateLedgerB.records[0].outcome_5m !== null || lateLedgerB.records[0].outcome_15m !== null || lateLedgerB.records[0].missed_5m !== true || lateLedgerB.records[0].missed_15m !== true || lateLedgerB.summary.matured5m !== 0) throw new Error("Late learning marks must not contaminate earlier outcome horizons");
          const calibrated = learning.applyLearningCalibration(signal,ledgerB.summary);
          if (calibrated.quantum.calibratedConfidence !== 70 || calibrated.quantum.learningCalibration.status !== "collecting") throw new Error("Learning calibration must remain inactive below 30 samples");
          const matureRecords = Array.from({length:40},(_,i)=>({id:"sample-"+i,market:"spot",status:"completed",outcome_5m:1.25}));
          const matureSummary = learning.summarizeLearningLedger(matureRecords,"spot");
          if (matureSummary.calibrationStatus !== "calibrated" || matureSummary.matured5m !== 40 || matureSummary.calibrationAdjustment !== 5) throw new Error("Bounded learning calibration did not activate at the minimum sample size");
          const workerSource = fs.readFileSync("cloudflare-worker/worker.js", "utf8");
          const htmlSource = fs.readFileSync("www/index.html", "utf8");
          const futuresUniverseStart = workerSource.indexOf("async function loadDigitalHunterFuturesUniverse");
          const futuresUniverseEnd = workerSource.indexOf("async function loadDigitalHunterUniverse", futuresUniverseStart);
          const futuresUniverseSource = workerSource.slice(futuresUniverseStart, futuresUniverseEnd);
          if (futuresUniverseStart < 0 || !futuresUniverseSource.includes("MEXC USDT Futures") || !futuresUniverseSource.includes("contract.mexc.com/api/v1/contract/detail") || !futuresUniverseSource.includes("contract.mexc.com/api/v1/contract/ticker") || !futuresUniverseSource.includes('x.state===0&&x.quoteCoin==="USDT"&&x.settleCoin==="USDT"')) throw new Error("MEXC active USDT perpetual discovery is missing");
          if (!workerSource.includes("cached_fallback:true") || !workerSource.includes("fresh:false")) throw new Error("Hunter universe refresh must expose stale cache fallback without relabelling it fresh");
          if (!workerSource.includes("minute%15===0?refreshDigitalHunterUniverses(env)")) throw new Error("Shared Spot/Futures universe refresh must run on the proven analyzer minute Cron");
          if (!workerSource.includes("const dueLearningRecords=") || !workerSource.includes("fetchHunterCandles(record.symbol,marketType,asset)") || !workerSource.includes("...learningMarks")) throw new Error("Self-learning must capture fresh 5m/15m/60m outcome marks for open signals");
          const hunterCandlesStart = workerSource.indexOf('async function fetchHunterCandles(symbol,marketType="spot",asset=null){');
          const hunterCandlesEnd = workerSource.indexOf("async function analyzeDigitalHunterSymbol", hunterCandlesStart);
          const hunterCandlesSource = workerSource.slice(hunterCandlesStart, hunterCandlesEnd);
          if (hunterCandlesStart < 0 || hunterCandlesSource.includes("HTTP (400|403|429|451)") || !hunterCandlesSource.includes("HTTP 400|invalid candle payload")) throw new Error("Hunter candle fallback must try alternate hosts after transient 403/429/451 errors");
          if (!workerSource.includes("function emaSeries(values,period)") || workerSource.includes("closes.slice(0,i+1)")) throw new Error("Multi-timeframe MACD must use linear-time EMA series, not quadratic recomputation");
          if (!workerSource.includes("const ASSET_SYMBOL_OVERRIDES=Object.freeze(")) throw new Error("AI analyzer must define safe asset-id to ticker overrides before request parsing");
          if (!workerSource.includes("async function monitorLocalTether(env)") || !workerSource.includes('monitor:"server-cron-1m"') || !workerSource.includes("await Promise.allSettled([cleanup,localTether,universeRefresh])")) throw new Error("Iranian Tether shock monitoring must run independently on the server cron");

          const radarSource = fs.readFileSync("cloudflare-worker/radar-worker.js", "utf8");
          const futuresSource = fs.readFileSync("cloudflare-worker/futures-worker.js", "utf8");
          const universeCronSource = fs.readFileSync("cloudflare-worker/hunter-cron-worker.js", "utf8");
          const cronStart = workerSource.indexOf("async function runDigitalHunterCron");
          const cronEnd = workerSource.indexOf("export default {", cronStart);
          const cronSource = workerSource.slice(cronStart, cronEnd);
          if (!futuresSource.includes('async scheduled(event,env)') || !futuresSource.includes('runDigitalHunterMarketCycle(env,"futures")') || !futuresSource.includes("digital-hunter-futures-cron-heartbeat")) throw new Error("Futures must run on its own scheduled Worker");
          if (!universeCronSource.includes("refreshDigitalHunterUniverses(env)") || !universeCronSource.includes("hourly-universe-refresh")) throw new Error("Hunter universe refresh must remain independent and low-frequency");
          if (!cronSource.includes('runDigitalHunterMarketCycle(env,"spot")') || cronSource.includes("FUTURES_ENGINE.fetch")) throw new Error("Analyzer Cron must scan Spot only; Futures has its own scheduler");
          if (!workerSource.includes("digital-hunter-futures-cron-heartbeat") || !workerSource.includes("markets:{spot,futures}")) throw new Error("Hunter status endpoint must merge independent Spot/Futures heartbeats");
          if (!radarSource.includes("cacheAge<=24*60*60*1000") || !radarSource.includes("cached universe; live candles") || !radarSource.includes("radar:last-error")) throw new Error("Radar must keep a recent cached universe fallback and record failures");
          if (!radarSource.includes("async function writeRadarRecord") || !radarSource.includes("env.ADMIN_DB.prepare") || radarSource.includes("RADAR_KV.put")) throw new Error("Radar persistence must use D1 and keep KV read-only");
          if (!workerSource.includes("previous?.ageMs<writeIntervalMs") || !(workerSource.includes("previous=null,minIntervalMs=60000") || workerSource.includes("previous=null,minIntervalMs=21600000")) || !workerSource.includes("getUTCHours()!==0||now.getUTCMinutes()!==15") || workerSource.includes("DELETE FROM market_data_cache WHERE cache_key = ?") || workerSource.includes("ORDER BY cached_at DESC LIMIT 2000") || !(workerSource.includes("staleCandles,30000") || workerSource.includes("staleCandles,3600000"))) throw new Error("Market fallback D1 writes must be throttled and cleanup bounded");
          if (!workerSource.includes("/hunter-combined-snapshot") || !htmlSource.includes("/hunter-combined-snapshot") || !htmlSource.includes("setInterval(load,600000)") || !htmlSource.includes("setInterval(refreshAll, 600000)") || !htmlSource.includes("20*60*1000")) throw new Error("Client polling must use combined Hunter snapshots and bounded refresh intervals");
          if (!workerSource.includes("buildLocalAnalysisFallback") || !workerSource.includes("Local quantitative fallback") || !workerSource.includes('action:"WAIT"')) throw new Error("AI analysis must degrade safely when all providers are unavailable");


          if (!radarSource.includes("const BATCH_SIZE = 12;") || !radarSource.includes("universe.length>500?12:BATCH_SIZE") || !radarSource.includes(".slice(0,3);")) throw new Error("Radar scan must stay within the per-invocation subrequest budget");
          if (!workerSource.includes("const HUNTER_BATCH_SIZE = 8;") || !workerSource.includes("const FUTURES_HUNTER_BATCH_SIZE = 8;") || !workerSource.includes("const sourceLimit=Math.min(4,sources.length)") || !workerSource.includes("for(const host of hosts.slice(0,2))") || !workerSource.includes("const concurrency=4;")) throw new Error("Hunter scan must stay within the per-invocation subrequest budget");
          if (!workerSource.includes("async scheduled(event,env,ctx)") || !workerSource.includes("await runDigitalHunterCron(event,env,ctx)") || workerSource.includes("ctx.waitUntil(runDigitalHunterCron")) throw new Error("Cron must await the Hunter cycle inside the scheduled invocation");
          if (!workerSource.includes("for(const url of urls)") || workerSource.includes("Promise.all(urls.map(url=>timeoutFetch")) throw new Error("Exchange health fallback must try alternate endpoints sequentially and stop after a verified response");
                    if (!workerSource.includes("async function fetchWithTimeout") || !workerSource.includes("return await fetch(url,{...options,signal:controller.signal})") || workerSource.includes("return await fetchWithTimeout(url,{...options,signal:controller.signal})")) throw new Error("Bounded fetch helper must call native fetch exactly once and must not recurse");
          if (!workerSource.includes("async function readMarketFallback") || !workerSource.includes("async function writeMarketFallback") || !workerSource.includes("env.MARKET_CACHE_DB") || !workerSource.includes("data_stale:true") || !workerSource.includes("X-MMP-Cache") || !workerSource.includes("market_cache_binding:!!env.MARKET_CACHE_DB")) throw new Error("Persistent D1 market cache and explicit stale-data reporting are required");
          if (!workerSource.includes('env.AI.run("@cf/openai/gpt-oss-120b"') || !workerSource.includes("max_tokens:1600")) throw new Error("Cloudflare AI GPT-OSS fallback is missing or unbounded");
                    const groqStart = workerSource.indexOf('https://api.groq.com/openai/v1/chat/completions');
          const groqEnd = workerSource.indexOf("if(!response.ok)", groqStart);
          if (groqStart < 0 || groqEnd < 0 || !workerSource.slice(groqStart, groqEnd).includes("response_format:{type:\"json_object\"}") || !workerSource.slice(groqStart, groqEnd).includes("max_completion_tokens:model.maxTokens")) throw new Error("Groq requests must use bounded JSON-mode completion");
                    const groqModelStart = workerSource.indexOf("const groqModels=[");
          const groqModelEnd = workerSource.indexOf("];", groqModelStart);
          const groqCascade = workerSource.slice(groqModelStart, groqModelEnd);
          if (groqModelStart < 0 || !groqCascade.includes('id:"openai/gpt-oss-120b"') || !groqCascade.includes('id:"openai/gpt-oss-20b"') || !groqCascade.includes('reasoning_effort:"low"') || !groqCascade.includes("maxTokens:1800")) throw new Error("Groq AI cascade must include bounded GPT-OSS 120B and 20B fallbacks");
                    if (!workerSource.includes("function analyzeClosedKlines") || !workerSource.includes("داده کندل‌های بسته‌شده کافی نیست") || !workerSource.includes("marketDataFresh") || !workerSource.includes("const volumeConfirmed=") || !workerSource.includes("currentPrice:last[4]")) throw new Error("Analyzer must use closed candles, deterministic freshness/volume gates, and explicit price evidence");
          if (!workerSource.includes('async function fetchHunterCandles(symbol,marketType="spot",asset=null){\n const pair=symbol+"USDT",get=url=>marketFlowJson(url,4500);') || !workerSource.includes("const get=(url,timeoutMs=4500)=>marketFlowJson(url,timeoutMs,signal)") || workerSource.includes("get=url=>get(url,4500)") || !workerSource.includes("async function settleHunterCycle") || !workerSource.includes("timeoutMs=50000") || !workerSource.includes("const concurrency=4;") || !workerSource.includes("marketFlowJson(url,timeoutMs,signal)") || !workerSource.includes("timeoutMs=4500") || !workerSource.includes("parentSignal?.addEventListener") || !workerSource.includes("setTimeout(()=>flowController.abort(),12000)") || !workerSource.includes("flowController.signal.aborted?\"flow_timeout\"") || !workerSource.includes("trades.length<8") || !workerSource.includes("cacheDigitalHunterUniverse") || !workerSource.includes("refreshDigitalHunterUniverses") || !workerSource.includes('const cacheId=stateId+"-universe-cache"') || !workerSource.includes("const cacheIsNewer=") || !workerSource.includes("if(!assets.length){") || !workerSource.includes("calculateMarketScanPriority") || !workerSource.includes("scanPriorityVersion:priorityVersion") || !workerSource.includes("const HUNTER_BATCH_SIZE = 8;") || !workerSource.includes("const FUTURES_HUNTER_BATCH_SIZE = 8;") || !workerSource.includes("const sourceLimit=Math.min(4,sources.length)") || !workerSource.includes("for(const host of hosts.slice(0,2))") || !workerSource.includes("Promise.allSettled(orderedSources.map(fn=>fn()))") || !workerSource.includes("const [sentimentResult,flowResult,depthResult]=await Promise.allSettled([") || !workerSource.includes('settleHunterCycle(()=>runDigitalHunterMarketCycle(env,"spot"),"spot",48000)') || workerSource.includes("ctx.waitUntil(runDigitalHunterCron")) throw new Error("Hunter scan budget/parallelism regression");
          if (!workerSource.includes("filter(x=>x.venues.size>=2)") || !workerSource.includes("x=>[+x[0]*1000,+x[5],+x[3],+x[4],+x[2],+x[1]]")) throw new Error("Futures venue qualification or Gate Spot OHLCV mapping regression");
          if (!workerSource.includes("QUALITY_REJECTED:") || !workerSource.includes("rejected_count:result.rejected||0") || !workerSource.includes("alignMarketCandles(primary.rows.slice(0,-1),secondary.rows.slice(0,-1)")) throw new Error("Shared-candle alignment or quality-rejection accounting missing");
          if (!workerSource.includes("async function loadHunterFundingSentiment") || !workerSource.includes("samples.length<2") || !workerSource.includes("sentimentConfirmed:sentiment.available")) throw new Error("Evidence-backed Futures sentiment engine is not connected to Quantum scoring");
          if (!workerSource.includes("failureCooldown") || !workerSource.includes("now+90*1000") || !workerSource.includes("now+60*1000") || !workerSource.includes("let examined=0;") || !workerSource.includes("cursor+Math.max(1,examined)") || workerSource.includes("const retry=assets.filter(asset=>!selectedSymbols.has")) throw new Error("Hunter cooldown retry or cursor progression regression");
          if (!workerSource.includes("const cacheIsNewer=Number(cached?.universeUpdatedAt)>universeUpdatedAt") || !workerSource.includes("const cachePayload=JSON.stringify({assets,universeUpdatedAt,universeSources,universeProvider})") || !workerSource.includes("JSON.stringify({cursor:snapshot.next_cursor,lastRun:now,universeUpdatedAt") || workerSource.includes("JSON.stringify({cursor:snapshot.next_cursor,lastRun:now,assets,universeUpdatedAt")) throw new Error("Hunter full-universe cache or compact scan-state persistence regression");
          if (!workerSource.includes("candidate_count:0,scanned_count:0,failed_count:0,rejected_count:0,cooldown_count:0,universe_refreshed:true")) throw new Error("Universe refresh must clear stale scan metrics");
          if (!workerSource.includes('from "./market-data-core.js"') || !workerSource.includes('from "./learning-engine.js"') || !workerSource.includes("mmp-learning-ledger-v1-") || !workerSource.includes("applyLearningCalibration")) throw new Error("Hunter shared data and persistent learning integration missing");
