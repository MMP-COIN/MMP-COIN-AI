              !workerSource.includes('primaryTrusted=[4,5,6,8].includes(primary)') ||
              !workerSource.includes('const priority=[4,5,6,2,1,3,0]') ||
              !workerSource.includes('priority=[4,8,5,6,2,3,1,7,0]') ||
              !workerSource.includes('const primaryIndex=preferredOrder[0]??fallbackPriority[0],primaryOrder=[primaryIndex];') ||
              !workerSource.includes('const fallbackPool=unique([...fallbackPriority.filter(index=>!primaryOrder.includes(index)),...preferredOrder.slice(1),...sources.map((_,index)=>index)]).filter(index=>!primaryOrder.includes(index));') ||
              !workerSource.includes('const sourceLimit=Math.min(4,sources.length),orderedIndices=unique([...primaryOrder,...fallbackPool])') ||
              !workerSource.includes('value.startsWith("kucoin")?6') ||
              !radarSource.includes('const verificationOrder=[...new Set([...order,...fallback])].slice(0,3);')) throw new Error("Reliable rotating exchange fallback coverage regressed");
          if (workerSource.includes("!available.length?priority")) throw new Error("Missing venue metadata must use the rotating fallback set");
          for (const provider of ["api.mexc.com/api/v3/trades","api.kucoin.com/api/v1/market/histories","api-futures.kucoin.com/api/v1/trade/history","contractInfo?.data?.multiplier"]) { if (!workerSource.includes(provider)) throw new Error("Executed-flow fallback/contract normalization missing: " + provider); }
          for (const provider of ["contract.mexc.com","api-futures.kucoin.com","api/v2/mix/market/candles","api/v2/mix/market/fills","api.mexc.com/api/v3/klines"]) { if (!workerSource.includes(provider)) throw new Error("Market provider fallback missing: " + provider); }
          if (!radarSource.includes("https://api.mexc.com/api/v3/klines")) throw new Error("MEXC Spot radar fallback missing");
          const base = {trend:"bull",currentPrice:100,change1m:0.12,change3m:0.2,change5m:0.35,change15m:0.5,volumeRatio:1.3,breakout:true,structureAligned:true,trend15:true,overextended:false,dataAgeMs:20000,multiExchangeConfirmed:true,totalVolume24h:300000,rsi14:61,ema9:102,ema21:101,ema50:100,macdHistogram:0.2};
          const candidate = mod.scoreQuantumOpportunity({...base,flowConfirmed:false});
          if (!candidate.candidateGate || candidate.qualityGate) throw new Error("Preliminary candidate gate is incorrect");
          const confirmed = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12});
          if (!confirmed.qualityGate) throw new Error("Fully confirmed signal did not pass");
          const noDepth = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,requireDepthConfirmation:true,depthConfirmed:false});
          const withDepth = mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,requireDepthConfirmation:true,depthConfirmed:true});
          if (noDepth.qualityGate || !withDepth.qualityGate || !noDepth.missingEvidence.includes("depth")) throw new Error("Order-book depth gate is incorrect");
          if (!withDepth.specialistEnsemble || withDepth.specialistEnsemble.modelCount < 5 || !Array.isArray(withDepth.specialistEnsemble.experts)) throw new Error("Specialist multi-model ensemble is not producing evidence-backed outputs");
          const rejected = [
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:-0.12}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,volumeRatio:0.9}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,multiExchangeConfirmed:false}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,overextended:true}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,dataAgeMs:200000}),
            mod.scoreQuantumOpportunity({...base,flowConfirmed:true,flowImbalance:0.12,totalVolume24h:90000})
          ];
          if (rejected.some(result => result.qualityGate)) throw new Error("A weak/stale/unconfirmed candidate passed the quality gate");
          const missingEvidence = [
