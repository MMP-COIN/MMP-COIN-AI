          echo "Canary Worker health HTTP $canary_health_status"
          if [ "$canary_health_status" != "200" ]; then cat /tmp/canary-health.json 2>/dev/null || true; exit 1; fi
          canary_health=$(cat /tmp/canary-health.json)
          echo "$canary_health" | jq -e '.worker == "online" and .ai_binding == true and .futures_engine_binding == true' >/dev/null
          canary_status=$(curl --silent --show-error --max-time 110 -H "Content-Type: application/json" -X POST --data "$payload" -o /tmp/canary-analysis.json -w "%{http_code}" "$CANARY_URL/analyze")
          echo "Canary AI analyzer HTTP $canary_status"
          if [ "$canary_status" != "200" ]; then
            jq -r '.stage // "unknown stage", .error // "unknown error"' /tmp/canary-analysis.json || cat /tmp/canary-analysis.json
            exit 1
          fi
          jq -e '.analysis.action as $a | (["BUY","SELL","WAIT"] | index($a) != null) and (.market.timeframes | has("15m") and has("1h") and has("4h") and has("1d"))' /tmp/canary-analysis.json >/dev/null
          jq -r '"Selected AI model: " + (.analysis.ai_provider // "not reported")' /tmp/canary-analysis.json
          jq -r '.analysis.ai_provider_fallbacks[]? | "AI fallback reason: " + .' /tmp/canary-analysis.json
          jq -r '"Canary model provider: " + (.analysis.data_source // "not reported")' /tmp/canary-analysis.json
          {
            echo "- AI analyzer: HTTP 200"
            echo "- Four timeframes: 15m, 1h, 4h, 1d"
            echo "- Structured analysis: valid"
          } >> "$GITHUB_STEP_SUMMARY"
