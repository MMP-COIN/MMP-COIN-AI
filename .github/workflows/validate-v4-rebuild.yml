name: Validate MMP V4 rebuild
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "www/v4/**"
      - ".github/workflows/validate-v4-rebuild.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "www/v4/**"
      - ".github/workflows/validate-v4-rebuild.yml"
permissions:
  contents: read

concurrency:
  group: mmp-coin-live-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check www/v4/app.js
      - name: Enforce fresh Tether conversion and reduced-motion support
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const app = fs.readFileSync("www/v4/app.js", "utf8");
          const css = fs.readFileSync("www/v4/app.css", "utf8");
          if (app.includes("mmp_tether_cache_v1") || app.includes("local-market-watch"))
            throw new Error("V4 Tether conversion must not restore cached or monitor-state prices");
          for (const guard of ["valid.length<2","consensus.length<2","source:\"Nobitex\"","source:\"Bitpin\"","source:\"Exir\"","source:\"Ramzinex\""]) {
            if (!app.includes(guard)) throw new Error("Live Tether consensus guard missing: " + guard);
          }
          if (!css.includes("@media (prefers-reduced-motion: reduce)"))
            throw new Error("Reduced-motion accessibility rule is missing");
          console.log("Fresh Tether conversion and reduced-motion accessibility guards verified.");
          NODE
      - name: Prevent false healthy status when core bindings are unavailable
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const app = fs.readFileSync("www/v4/app.js", "utf8");
          const start = app.indexOf("async function loadHealth()");
          const end = app.indexOf("let marketChart", start);
          if (start < 0 || end < 0) throw new Error("Health status implementation missing");
          const health = app.slice(start, end);
          for (const required of [
            "runtime.ai_binding===true",
            "runtime.futures_engine_binding===true",
            "runtime.market_cache_binding===true",
            "runtime.admin_db_binding===true",
            "const fullyHealthy=runtimeHealthy&&connectionsHealthy",
            "ENGINE VERSION UNVERIFIED"
          ]) {
            if (!health.includes(required)) throw new Error("Health status must enforce: " + required);
          }
          console.log("Core health and all required bindings are mandatory for healthy status.");
          NODE
      - name: Validate resilient chart loading and exact Worker route wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("www/v4/index.html", "utf8");
          const app = fs.readFileSync("www/v4/app.js", "utf8");
          const worker = fs.readFileSync("cloudflare-worker/worker.js", "utf8");
          const radar = fs.readFileSync("cloudflare-worker/radar-worker.js", "utf8");
          if (!html.includes("window.mmpChartLibraryReady") || !html.includes("unpkg.com/lightweight-charts@4.2.3")) throw new Error("Chart CDN fallback is missing");
          if (!app.includes("await window.mmpChartLibraryReady") || !app.includes("window.LightweightCharts")) throw new Error("Chart initialization must wait for a confirmed library load");
          for (const route of ["/health","/connections-health","/local-market-watch","/market-proxy","/hunter-combined-snapshot","/market-candles","/analyze"]) {
            if (!worker.includes(route)) throw new Error("V4 calls an Analyzer route that is absent from the Worker: " + route);
          }
          if (!radar.includes("/health") || !radar.includes("/fast-radar-snapshot")) throw new Error("V4 Radar routes are missing");
          if (/fetch\(\s*["'`]https?:\/\/(?:api|fapi|stream)\./i.test(app)) throw new Error("Browser code must not call exchange APIs directly");
          for (const source of [worker, fs.readFileSync("cloudflare-worker/futures-worker.js","utf8")]) {
            if (source.includes("TETHER_MONITOR")) throw new Error("Required V4 Workers must not depend on an extra Tether Worker");
          }
          console.log("Chart fallback, Analyzer/Radar route wiring and no-direct-exchange policy verified.");
          NODE
      - name: Inspect current public Pages response without publishing
        run: |
          set -euo pipefail
          status=$(curl -sSL --max-time 20 -o /tmp/mmp-current-pages.html -w "%{http_code}" "https://mmp-coin.github.io/")
          echo "PUBLIC_PAGES_HTTP=$status"
          if [ "$status" = "404" ] || [ "$status" = "410" ] || [ "$status" = "503" ]; then
            echo "PUBLIC_PAGES_UNAVAILABLE=true"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("/tmp/mmp-current-pages.html")
          body=p.read_text(encoding="utf-8",errors="replace") if p.exists() else ""
          title=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
          title_text=re.sub(r"\s+"," ",title.group(1)).strip() if title else "UNAVAILABLE"
          maintenance_terms=("maintenance","در حال تعمیر","موقتاً غیرفعال","سایت موقتاً در دسترس نیست","در حال آماده‌سازی نسخه جدید")
          legacy_terms=("MMP QUANTUM | مرکز هوشمند رمزارزها","native-app-menu","native-update-check-btn","دانلود و به‌روزرسانی اپلیکیشن")
          maintenance_hits=[x for x in maintenance_terms if x.lower() in body.lower()]
          legacy_hits=[x for x in legacy_terms if x.lower() in body.lower()]
          print("PUBLIC_PAGES_TITLE="+title_text)
          print("PUBLIC_PAGES_MAINTENANCE_HITS="+repr(maintenance_hits))
          print("PUBLIC_PAGES_LEGACY_HITS="+repr(legacy_hits))
          print("PUBLIC_PAGES_BYTES="+str(len(body)))
          if not body or (not maintenance_hits and len(legacy_hits)>0):
              raise SystemExit("Public Pages is serving legacy site content without an explicit maintenance screen.")
          if not maintenance_hits and title_text != "UNAVAILABLE":
              raise SystemExit("Public Pages returned HTML without an explicit maintenance marker; release remains locked.")
          PY
      - name: Smoke-test live market services and browser CORS
        run: |
          node --input-type=module <<'JS'
          const recent = (value, maxAgeMs) => {
            const at = Date.parse(value || ""), age = Date.now() - at;
            return Number.isFinite(at) && age >= -120000 && age <= maxAgeMs;
          };
          const checks = [
            ["main worker health", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/health", d => d.worker === "online" && /^QIE-\d+\.\d+\.\d+$/.test(d.engine_version) && d.ai_binding === true && d.futures_engine_binding === true && d.market_cache_binding === true],
            ["futures engine binding", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/futures-engine-health", d => d.service_binding === "connected" && d.status === "online" && d.market === "futures" && /^QIE-\d+\.\d+\.\d+$/.test(d.engine_version)],
            ["exchange connections", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/connections-health", d => {
              const healthy = market => d.checks.filter(x => x.market === market && ["ok", "slow"].includes(x.status)).length;
              return Array.isArray(d.checks) && d.checks.length >= 10 && healthy("spot") >= 2 && healthy("futures") >= 2 && healthy("iran") >= 1;
            }],
            ["hunter snapshot", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/hunter-combined-snapshot", d => {
              const spot = d.spot?.snapshot || d.spot, futures = d.futures?.snapshot || d.futures;
              return !!spot && !!futures && Array.isArray(spot.signals) && Array.isArray(futures.signals) &&
                Number(spot.universe_count) > 0 && Number(futures.universe_count) > 0 &&
                Number(spot.scanned_count) > 0 && Number(futures.scanned_count) > 0 &&
                recent(spot.scanned_at || spot.checked_at, 15*60*1000) &&
                recent(futures.scanned_at || futures.checked_at, 15*60*1000);
            }],
            ["market proxy", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=okx-tickers", d => Array.isArray(d.data) && d.data.some(x => x.instId === "BTC-USDT" && Number(x.last) > 0)],
            ["live spot candles", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-candles?symbol=BTCUSDT&interval=1h&market=spot", d => d.symbol === "BTCUSDT" && d.market === "spot" && d.data_stale !== true && Number(d.data_age_ms) < 2*3600000+120000 && Array.isArray(d.candles) && d.candles.length >= 55 && d.candles.every(x => Number(x.time) > 0 && Number(x.open) > 0 && Number(x.high) >= Math.max(Number(x.open),Number(x.close)) && Number(x.low) <= Math.min(Number(x.open),Number(x.close)) && Number(x.close) > 0)],
            ["live futures candles", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-candles?symbol=BTCUSDT&interval=1h&market=futures", d => d.symbol === "BTCUSDT" && d.market === "futures" && d.data_stale !== true && Number(d.data_age_ms) < 2*3600000+120000 && Array.isArray(d.candles) && d.candles.length >= 55 && d.candles.every(x => Number(x.time) > 0 && Number(x.open) > 0 && Number(x.high) >= Math.max(Number(x.open),Number(x.close)) && Number(x.low) <= Math.min(Number(x.open),Number(x.close)) && Number(x.close) > 0)],
            ["radar health", "https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/health", d => d.worker === "online"],
            ["radar snapshot", "https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/fast-radar-snapshot", d => Array.isArray(d.signals) && !!d.engine && !!d.engine_version && Number(d.universe_count) > 0 && (Number(d.cycle_scanned_count) > 0 || Number(d.scanned_count) > 0 || (Array.isArray(d.candidate_details) && d.candidate_details.length > 0)) && recent(d.scanned_at, 10*60*1000)],
          ];
          const livePayloads = {};
          for (const [name, url, valid] of checks) {
            let response = null, lastError = null;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const candidate = await fetch(url, {headers: {accept: "application/json"}, signal: AbortSignal.timeout(15000)});
                if (candidate.ok) { response = candidate; break; }
                const body = await candidate.text();
                const transient = [502,503,504].includes(candidate.status);
                if (transient && attempt < 2) {
                  console.warn(name + " transient HTTP " + candidate.status + "; retry " + (attempt+1));
                  await new Promise(resolve => setTimeout(resolve, 700*(attempt+1)));
                  continue;
                }
                throw new Error(name + " returned HTTP " + candidate.status + ": " + body.slice(0,700));
              } catch (error) {
                lastError = error;
                if (attempt < 2 && /fetch failed|network|timeout|aborted/i.test(String(error?.message||error))) {
                  await new Promise(resolve => setTimeout(resolve, 700*(attempt+1)));
                  continue;
                }
                throw error;
              }
            }
            if (!response) throw lastError || new Error(name + " did not respond after three attempts");
            const data = await response.json();
            if (!valid(data)) throw new Error(name + " returned an unexpected payload");
            if (name === "market proxy" && response.headers.get("X-MMP-Cache") !== "fresh")
              throw new Error("market proxy returned stale or unverified cache data");
            livePayloads[name] = data;
            console.log("PASS", name);
          }
          if (livePayloads["main worker health"].engine_version !== livePayloads["futures engine binding"].engine_version)
            throw new Error("Analyzer and Futures runtime versions do not match");
          console.log("PASS matching runtime version", livePayloads["main worker health"].engine_version);

          const tetherSources = ["nobitex-tether","wallex-markets","bitpin-tickers","exir-tickers","ramzinex-pairs"];
          const tetherResults = await Promise.all(tetherSources.map(async source => {
            try {
              const response = await fetch("https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source="+source, {signal:AbortSignal.timeout(15000)});
              if (!response.ok || String(response.headers.get("X-MMP-Cache")||"").toLowerCase() !== "fresh") return {source,data:null};
              return {source,data:await response.json()};
            } catch { return {source,data:null}; }
          }));
          const quotes = [];
          const addQuote = (source,value) => { const price=Number(value); if(Number.isFinite(price)&&price>=1000&&price<=100000000)quotes.push({source,price}); };
          const bySource = Object.fromEntries(tetherResults.map(x=>[x.source,x.data]));
          const nobitex = bySource["nobitex-tether"];
          addQuote("Nobitex",Number(nobitex?.stats?.["usdt-rls"]?.latest)/10);
          const wallex = bySource["wallex-markets"], wr=wallex?.result?.symbols||wallex?.result?.markets||{}, wrows=Array.isArray(wr)?wr:Object.values(wr);
          const wt=wrows.find(x=>["USDTTMN","USDTIRT"].includes(String(x?.symbol||"").toUpperCase())), wi=wrows.find(x=>["USDTIRR","USDTRLS"].includes(String(x?.symbol||"").toUpperCase()));
          const wtm=Number(wt?.stats?.lastPrice??wt?.lastPrice), wir=Number(wi?.stats?.lastPrice??wi?.lastPrice);
          addQuote("Wallex",wtm>0?wtm:wir/10);
          const bitpin=bySource["bitpin-tickers"], br=Array.isArray(bitpin?.results)?bitpin.results:Array.isArray(bitpin?.data)?bitpin.data:Array.isArray(bitpin)?bitpin:[];
          const bp=br.find(x=>{const c=String(x?.code||x?.symbol||"").replace(/[/-]/g,"_").toUpperCase(),flat=c.replace(/_/g,"");const b=String(x?.currency1?.code||x?.base_currency||x?.baseAsset||"").toUpperCase(),q=String(x?.currency2?.code||x?.quote_currency||x?.quoteAsset||c.split("_").pop()).toUpperCase();return /^USDT_(IRT|IRR|RLS|TMN)$/.test(c)||/^USDT(IRT|IRR|RLS|TMN)$/.test(flat)||(b==="USDT"&&["IRT","IRR","RLS","TMN"].includes(q));});
          const bpPrice=Number(bp?.price_info?.price??bp?.internal_price_info?.price??bp?.price??bp?.last_price??bp?.last),bpUnit=String(bp?.currency2?.code||bp?.quote_currency||bp?.quoteAsset||String(bp?.code||bp?.symbol||"USDT_IRT").split(/[_/-]/).pop()).toUpperCase();
          addQuote("Bitpin",["IRR","RLS"].includes(bpUnit)?bpPrice/10:bpPrice);
          const exir=bySource["exir-tickers"], es=exir?.result||exir?.data||exir||{}, ee=Array.isArray(es)?es.map(x=>[x?.symbol||x?.pair||"",x]):Object.entries(es);
          const ep=ee.find(([k,v])=>/^(usdt-(irt|tmn|toman|irr|rls)|(irt|tmn|toman|irr|rls)-usdt)$/.test(String(v?.symbol||v?.pair||k).toLowerCase().replace(/[_/]/g,"-")));
          if(ep){const sym=String(ep[1]?.symbol||ep[0]).toLowerCase().replace(/[_/]/g,"-"),parts=sym.split("-"),rev=parts[0]!=="usdt",unit=rev?parts[0]:parts[1],raw=Number(ep[1]?.last??ep[1]?.close??ep[1]?.price),price=rev&&raw>0?1/raw:raw;addQuote("Exir",price>0?(["irr","rls"].includes(unit)?price/10:price):0);}
          const ram=bySource["ramzinex-pairs"], rr=ram?.result?.data??ram?.data??ram?.result?.pairs??ram?.pairs??[], rrows=Array.isArray(rr)?rr:Object.values(rr);
          const code=v=>Array.isArray(v)?String(v[0]?.symbol??v[0]?.code??v[0]??""):String(v?.symbol??v?.code??v?.name??v??"");
          const rp=rrows.find(x=>{const b=code(x?.base_currency_symbol??x?.base_currency??x?.baseCurrency).toUpperCase(),q=code(x?.quote_currency_symbol??x?.quote_currency??x?.quoteCurrency).toUpperCase(),n=String(x?.url_name??x?.symbol??x?.pair??"").toLowerCase().replace(/[_/]/g,"-");return b==="USDT"&&["IRR","IRT","RLS","TMN","TOMAN"].includes(q)||/^usdt-(irr|irt|rls|tmn|toman)$/.test(n);});
          if(rp){const b=Number(rp.buy??rp.best_buy??rp.bid),a=Number(rp.sell??rp.best_sell??rp.ask),last=Number(rp.last??rp.last_price??rp.price??rp.rate),q=code(rp.quote_currency_symbol??rp.quote_currency??rp.quoteCurrency).toUpperCase(),raw=b>0&&a>0?(a+b)/2:last;addQuote("Ramzinex",raw>0?(["IRR","RLS"].includes(q)?raw/10:raw):0);}
          if(quotes.length<2)throw new Error("Fewer than two fresh independent Tether sources returned valid prices: "+JSON.stringify(quotes));
          const sorted=quotes.map(x=>x.price).sort((a,b)=>a-b),mid=Math.floor(sorted.length/2),median=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
          const consensus=quotes.filter(x=>Math.abs(x.price-median)/median<=0.025);
          if(consensus.length<2)throw new Error("No Tether source consensus within 2.5%: "+JSON.stringify(quotes));
          console.log("PASS corroborated live Tether rate",consensus);
          const tickerSources = ["binance-tickers","okx-tickers","bybit-tickers","gate-tickers","kucoin-tickers","bitget-tickers","mexc-tickers"];
          const tickerResults = await Promise.all(tickerSources.map(async source => {
            try {
              const response = await fetch("https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source="+source,{signal:AbortSignal.timeout(15000)});
              if(!response.ok||String(response.headers.get("X-MMP-Cache")||"").toLowerCase()!=="fresh")return {source,data:null};
              return {source,data:await response.json()};
            } catch { return {source,data:null}; }
          }));
          const normalize=(source,data)=>{
            let rows=[];
            if(["binance-tickers","gate-tickers","mexc-tickers"].includes(source))rows=Array.isArray(data)?data.map(x=>[x.symbol||x.currency_pair,x.lastPrice||x.last||x.close]):[];
            else if(source==="okx-tickers")rows=(data.data||[]).map(x=>[x.instId,x.last]);
            else if(source==="bybit-tickers")rows=(data.result?.list||[]).map(x=>[x.symbol,x.lastPrice]);
            else if(source==="kucoin-tickers")rows=(data.data?.ticker||[]).map(x=>[x.symbol,x.last]);
            else if(source==="bitget-tickers")rows=(data.data||[]).map(x=>[x.symbol,x.lastPr||x.last]);
            return rows.map(([symbol,price])=>[String(symbol||"").toUpperCase().replace(/[^A-Z0-9]/g,""),Number(price)]);
          };
          const goldQuotes=tickerResults.flatMap(x=>x.data?normalize(x.source,x.data).filter(([symbol,price])=>symbol==="PAXGUSDT"&&Number.isFinite(price)&&price>0).map(([symbol,price])=>({source:x.source,price})):[]);
          if(goldQuotes.length<2)throw new Error("Tokenized-gold PAXG/USDT must have two fresh independent exchange quotes: "+JSON.stringify(goldQuotes));
          const goldSorted=goldQuotes.map(x=>x.price).sort((a,b)=>a-b),goldMedian=goldSorted.length%2?goldSorted[(goldSorted.length-1)/2]:(goldSorted[goldSorted.length/2-1]+goldSorted[goldSorted.length/2])/2;
          const goldSpread=(goldSorted[goldSorted.length-1]-goldSorted[0])/goldMedian;
          if(goldSpread>0.015)throw new Error("PAXG/USDT exchange quotes diverge by more than 1.5%: "+JSON.stringify(goldQuotes));
          console.log("PASS multi-exchange tokenized-gold quote",goldQuotes,"spread",goldSpread);
          const mainEndpoints = [
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/health",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/futures-engine-health",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/connections-health",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/hunter-combined-snapshot",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=okx-tickers",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/local-market-watch",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=nobitex-tether",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=wallex-markets",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=bitpin-tickers",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=exir-tickers",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=ramzinex-pairs",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-candles?symbol=BTCUSDT&interval=1h&market=spot",
          ];
          for (const origin of ["https://mmp-coin.github.io", "capacitor://localhost"]) {
            for (const url of mainEndpoints) {
              const response = await fetch(url, {method: "OPTIONS", headers: {Origin: origin, "Access-Control-Request-Method": "GET"}});
              if (response.status !== 204 || response.headers.get("access-control-allow-origin") !== origin)
                throw new Error("CORS origin rejected for " + origin + " " + new URL(url).pathname);
              console.log("PASS CORS", origin, new URL(url).pathname);
            }
            const analyzeOptions = await fetch("https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/analyze", {
              method: "OPTIONS",
              headers: {Origin: origin, "Access-Control-Request-Method": "POST", "Access-Control-Request-Headers": "content-type"}
            });
            if (analyzeOptions.status !== 204 || analyzeOptions.headers.get("access-control-allow-origin") !== origin ||
                !String(analyzeOptions.headers.get("access-control-allow-methods") || "").includes("POST") ||
                !String(analyzeOptions.headers.get("access-control-allow-headers") || "").toLowerCase().includes("content-type"))
              throw new Error("Analyzer POST CORS preflight failed for " + origin);
            console.log("PASS Analyzer POST CORS", origin);
          }
          const analyzeOrigin = "https://mmp-coin.github.io";
          const analyzeResponse = await fetch("https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/analyze", {
            method: "POST",
            headers: {Origin: analyzeOrigin, "Content-Type": "application/json", Accept: "application/json"},
            body: JSON.stringify({symbol: "BTCUSDT", name: "BTCUSDT", market_mode: "spot"}),
            signal: AbortSignal.timeout(70000)
          });
          if (!analyzeResponse.ok) throw new Error("Analyzer POST returned HTTP " + analyzeResponse.status);
          if (analyzeResponse.headers.get("access-control-allow-origin") !== analyzeOrigin)
            throw new Error("Analyzer POST CORS response rejected the website origin");
          const analyzePayload = await analyzeResponse.json();
          const analyzedFrames = analyzePayload?.market?.timeframes;
          const requiredFrames = ["15m", "1h", "4h", "1d"];
          if (!analyzePayload?.analysis || !["BUY", "SELL", "WAIT"].includes(String(analyzePayload.analysis.action || "").toUpperCase()) ||
              !analyzePayload?.market || analyzePayload.market.market_data_fresh !== true ||
              !analyzedFrames || !requiredFrames.every(tf =>
                Number(analyzedFrames[tf]?.price) > 0 &&
                Number.isFinite(Number(analyzedFrames[tf]?.data_age_ms)) &&
                Number(analyzedFrames[tf]?.data_age_ms) >= 0 &&
                Number(analyzedFrames[tf]?.data_age_ms) <= ({"15m":20,"1h":65,"4h":245,"1d":1445}[tf] * 60000) &&
                typeof analyzedFrames[tf]?.data_provider === "string" &&
                analyzedFrames[tf].data_provider.length > 0) ||
              analyzePayload.analysis.market_data_fresh !== true)
            throw new Error("Analyzer POST returned incomplete, stale, or empty four-timeframe market data");
          console.log("PASS live analyzer POST", {
            symbol: analyzePayload.market.symbol,
            action: analyzePayload.analysis.action,
            providers: [...new Set(requiredFrames.map(tf => analyzedFrames[tf].data_provider))],
            ages_ms: Object.fromEntries(requiredFrames.map(tf => [tf, analyzedFrames[tf].data_age_ms])),
            market_timestamp: analyzePayload.market.market_timestamp
          });
          for (const origin of ["https://mmp-coin.github.io", "capacitor://localhost"]) {
            const radarCors = await fetch("https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/fast-radar-snapshot", {
              headers: {Origin: origin, Accept: "application/json"}
            });
            if (!radarCors.ok || radarCors.headers.get("access-control-allow-origin") !== "*")
              throw new Error("Radar actual GET CORS failed for " + origin + ": HTTP " + radarCors.status);
            const radarPayload = await radarCors.json();
            if (!Array.isArray(radarPayload.signals) || !Number(radarPayload.universe_count) ||
                !recent(radarPayload.scanned_at, 10*60*1000))
              throw new Error("Radar returned stale or empty data for " + origin);
            console.log("PASS Radar actual GET CORS and fresh snapshot", origin);
          }
          JS
