name: Validate MMP V4 rebuild
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "www/v4/**"
      - ".github/workflows/validate-v4-rebuild.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "www/v4/**"
      - ".github/workflows/validate-v4-rebuild.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check www/v4/app.js
      - name: Smoke-test live market services and browser CORS
        run: |
          node --input-type=module <<'JS'
          const checks = [
            ["main health", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/connections-health", d => Array.isArray(d.checks) && d.checks.length >= 10 && d.checks.some(x => x.status === "ok" || x.status === "slow")],
            ["hunter snapshot", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/hunter-combined-snapshot", d => !!d.spot && !!d.futures && Array.isArray(d.spot.signals) && Array.isArray(d.futures.signals) && Number(d.spot.universe_count) > 0 && Number(d.futures.universe_count) > 0],
            ["market proxy", "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-proxy?source=okx-tickers", d => Array.isArray(d.data) && d.data.some(x => x.instId === "BTC-USDT" && Number(x.last) > 0)],
            ["radar health", "https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/health", d => d.worker === "online"],
            ["radar snapshot", "https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/fast-radar-snapshot", d => Array.isArray(d.signals) && !!d.engine && !!d.engine_version && Number(d.universe_count) > 0 && !!d.scanned_at],
                  ];
          for (const [name, url, valid] of checks) {
            const response = await fetch(url, {headers: {accept: "application/json"}});
            if (!response.ok) throw new Error(name + " returned HTTP " + response.status);
            const data = await response.json();
            if (!valid(data)) throw new Error(name + " returned an unexpected payload");
            console.log("PASS", name);
          }
          const mainEndpoints = [
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/connections-health",
            "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/hunter-combined-snapshot",
          ];
          for (const origin of ["https://mmp-coin.github.io", "capacitor://localhost"]) {
            for (const url of mainEndpoints) {
              const response = await fetch(url, {method: "OPTIONS", headers: {Origin: origin, "Access-Control-Request-Method": "GET"}});
              if (response.headers.get("access-control-allow-origin") !== origin)
                throw new Error("CORS origin rejected for " + origin + " " + new URL(url).pathname);
              console.log("PASS CORS", origin, new URL(url).pathname);
            }
          }
          const radarCors = await fetch("https://mmp-coin-ai-radar.mehrdadmohammadi1988.workers.dev/fast-radar-snapshot", {
            headers: {Origin: "capacitor://localhost", Accept: "application/json"}
          });
          if (!radarCors.ok) throw new Error("Radar GET failed for Capacitor origin: HTTP " + radarCors.status);
          if (radarCors.headers.get("access-control-allow-origin") !== "*")
            throw new Error("Radar GET CORS missing wildcard; received " + radarCors.headers.get("access-control-allow-origin"));
          console.log("PASS Radar GET CORS wildcard");
          JS
      - name: Validate rebuild structure and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("www/v4/index.html").read_text(encoding="utf-8")
          css = Path("www/v4/app.css").read_text(encoding="utf-8")
          js = Path("www/v4/app.js").read_text(encoding="utf-8")
          for required in ["id=\"command\"", "id=\"radar\"", "id=\"hunter\"", "id=\"analyzer\"", "id=\"engines\"", "id=\"engineCore\"", "app.css", "app.js"]:
              assert required in html, f"Missing required UI mount: {required}"
          for required in ["QIE-4.0.0", "فرماندهی کوانتومی", "رادار هوشمند", "شکارچی کوانتومی", "تحلیل‌گر هوشمند", "موتور هوشمند یکپارچه"]:
              assert required in html, f"Missing required product section: {required}"
          for required in ["hunter-combined-snapshot", "fast-radar-snapshot", "/connections-health", "cache:\"no-store\""]:
              assert required in js, f"Missing live integration: {required}"
          assert "هیچ سیگنال ساختگی" in html, "No fabricated-signal disclosure"
          for required in ["tickerIntegrity", "advisoryPolicy", "هیچ نقطه ورود", "تصمیم نهایی همیشه با کاربر"]:
              assert required in html, f"Missing trust policy: {required}"
          for required in ["Promise.allSettled(sources.map", "spread>1.5", "integrity-warning", "parseTimestamp", "age>maxAgeMs", "داده اسکن قدیمی"]:
              assert required in js, f"Missing integrity guard: {required}"
          assert "Math.random" not in js and "fake" not in js.lower(), "Synthetic market data is not allowed"
          assert "مرکز فرماندهی کوانتومی" not in html and "engineGrid" not in html and "engineGrid" not in js, "Legacy title or visible 12-engine grid remains"
          assert len(css) > 8000, "Responsive terminal stylesheet unexpectedly small"
          assert "Math.random" not in js and "fake" not in js.lower(), "Synthetic market data is not allowed"
          print("V4 UI mounts, responsive assets, live endpoints, and no-fabricated-data guard validated.")
          PY

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: |
          python3 -m http.server 4173 --directory www/v4 >/tmp/mmp-v4-http.log 2>&1 &
          echo $! >/tmp/mmp-v4-http.pid
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";

          const browser = await chromium.launch({headless: true});
          const failures = [];
          async function checkDevice(name, viewport, mobile) {
            const context = await browser.newContext({ viewport, isMobile: mobile, hasTouch: mobile });
            const page = await context.newPage();
            page.on("pageerror", error => failures.push(name + " page error: " + error.message));
            const response = await page.goto("http://127.0.0.1:4173/", {waitUntil: "networkidle", timeout: 30000});
            assert.equal(response.status(), 200, name + ": homepage must return HTTP 200");
            await page.waitForSelector("#engineCore", {timeout: 10000});
            assert.equal(await page.locator("#engineCore").count(), 1, name + ": expected one unified intelligence engine");
            for (const id of ["command", "radar", "hunter", "analyzer", "engines"]) {
              assert.equal(await page.locator("#" + id).count(), 1, name + ": missing section #" + id);
            }
            assert.equal(await page.locator("#ticker .ticker-item").count(), 4, name + ": expected four ticker slots");

            if (mobile) {
              const nav = page.locator(".desktop-nav");
              await page.locator("#menuToggle").click();
              assert(await nav.evaluate(el => el.classList.contains("open")), "mobile menu must open");
              await nav.locator('a[href="#radar"]').click();
              assert(!(await nav.evaluate(el => el.classList.contains("open"))), "mobile menu must close after navigation");
            } else {
              await page.locator('.desktop-nav a[href="#radar"]').click();
              await page.waitForFunction(() => Math.abs(document.querySelector("#radar").getBoundingClientRect().top) < 180, null, {timeout: 5000});
            }

            await page.locator('[data-refresh="radar"]').click();
            await page.locator('[data-refresh="hunter"]').click();
            await page.locator("#refreshAll").click();
            await page.waitForTimeout(500);

            const dimensions = await page.evaluate(() => ({
              viewport: document.documentElement.clientWidth,
              page: document.documentElement.scrollWidth
            }));
            assert(dimensions.page <= dimensions.viewport + 2,
              name + ": horizontal overflow (" + dimensions.page + " > " + dimensions.viewport + ")");
            await context.close();
            console.log("PASS browser smoke:", name);
          }

          try {
            await checkDevice("desktop", {width: 1440, height: 1000}, false);
            await checkDevice("android-mobile", {width: 390, height: 844}, true);
          } finally {
            await browser.close();
          }
          assert.deepEqual(failures, [], "browser runtime errors: " + failures.join("; "));
          JS
