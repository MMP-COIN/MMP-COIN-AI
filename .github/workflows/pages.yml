name: Retire duplicate project Pages deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Keep root-domain Pages as the only public site
        run: |
          echo "Project Pages deployment is intentionally disabled."
          echo "Canonical public site: https://mmp-coin.github.io/"
          echo "Canonical source: MMP-COIN/MMP-COIN-AI/www"
          echo "The root mirror workflow in MMP-COIN/MMP-COIN.github.io publishes the live site."
